// always exactly five of them, and selecting them all is the obvious move. It
// is also, of course, rejected.
//
// From level 5 the tiles start swapping under the pointer, so the fire you were
// about to click is somewhere else by the time you get there.


// The six from the spec and nothing else.
const FIRE_SET = {
  fire: '\u{1F525}',
  droplet: '\u{1F4A7}',
  ice: '\u{1F9CA}',
  wave: '\u{1F30A}',
  snow: '❄️',
  candle: '\u{1F56F}️'
};

// 25 tiles: five fires, four of everything else. Fixed counts, shuffled layout,
// so every level looks new and every level looks winnable.
const FIRE_POOL = [
  ...Array(5).fill(FIRE_SET.fire),
  ...Array(4).fill(FIRE_SET.droplet),
  ...Array(4).fill(FIRE_SET.ice),
  ...Array(4).fill(FIRE_SET.wave),
  ...Array(4).fill(FIRE_SET.snow),
  ...Array(4).fill(FIRE_SET.candle)
];

// The level from which tiles start running away. SPEC section 6, row 1.
const FIRE_SWAP_LEVEL = 5;

// Motion is gated on a chaos flag rather than the level alone. `fx-shake` is a
// MOTION_FLAG, so it is withheld under prefers-reduced-motion and those
// visitors get a completely static grid.
function fireSwapsAllowed(level) {
  const body = document.body;
  return level >= FIRE_SWAP_LEVEL && Boolean(body) && body.classList.contains('fx-shake');
}

function fireTile(emoji, index) {
  const tile = document.createElement('button');
  tile.type = 'button';
  tile.className = 'fire-tile';
  tile.dataset.index = String(index);
  tile.setAttribute('aria-pressed', 'false');
  tile.textContent = emoji;
  return tile;
}

const fireSelect = (tile) => {
  const selected = tile.classList.toggle('fire-tile-selected');
  tile.setAttribute('aria-pressed', String(selected));
};

// A swap trades contents with a neighbour a couple of squares away, which reads
// as the grid rearranging itself rather than one tile glitching.
function fireSwap(tiles, tile) {
  const from = tiles.indexOf(tile);
  const to = (from + 7 + (Date.now() % 5)) % tiles.length;
  if (to === from) return;

  const other = tiles[to];
  const heldText = other.textContent;
  const heldSelected = other.classList.contains('fire-tile-selected');

  other.textContent = tile.textContent;
  other.classList.toggle('fire-tile-selected', tile.classList.contains('fire-tile-selected'));
  other.setAttribute('aria-pressed', String(other.classList.contains('fire-tile-selected')));

  tile.textContent = heldText;
  tile.classList.toggle('fire-tile-selected', heldSelected);
  tile.setAttribute('aria-pressed', String(heldSelected));

  tile.classList.remove('fire-tile-swapped');
  other.classList.remove('fire-tile-swapped');
  // Forced reflow so the flash animation restarts on a tile that just ran.
  void tile.offsetWidth;
  tile.classList.add('fire-tile-swapped');
  other.classList.add('fire-tile-swapped');
}

// scripts/captchas/puzzle.js
// CAPTCHA 5: puzzle. SPEC.md section 6, row 5.
//
// Four pieces of one small picture, four dashed sockets, and a ghost of the
// finished image showing through the frame. It drags beautifully. The piece
// really does reach the socket, sits there for exactly as long as you hold the
// pointer down, and slides off the moment you let go.
//
// Ten seconds later the challenge fails on its own, which is just enough time
// to try it three times and start doubting your hands.

// Board geometry in CSS pixels. Everything is absolute inside the board, so the
// same numbers drive the layout, the drag maths and the clamping.
const PUZZLE_BOARD = { width: 300, height: 180 };
const PUZZLE_PIECE = 60;
const PUZZLE_FRAME = { left: 90, top: 30 };

// SPEC section 6 row 5: auto-fail at 10s.
const PUZZLE_SECONDS = 10;

// The level from which the countdown starts lying. SPEC section 6 row 5.
const PUZZLE_UNRELIABLE_LEVEL = 5;

// Scattered starts, one per quadrant of the picture. Far enough from the frame
// that the board reads as "four pieces waiting to be assembled".
const PUZZLE_LAYOUT = [
  { column: 0, row: 0, start: { x: 8, y: 6 } },
  { column: 1, row: 0, start: { x: 230, y: 12 } },
  { column: 0, row: 1, start: { x: 12, y: 112 } },
  { column: 1, row: 1, start: { x: 228, y: 108 } }
];

// Candidate escape offsets, tried in order from a rotating start so no two
// releases behave the same way. The first one that lands clear of both the drop
// point and the socket wins.
const PUZZLE_ESCAPES = [
  { x: 34, y: -12 },
  { x: -30, y: 18 },
  { x: 16, y: 32 },
  { x: -24, y: -28 },
  { x: 38, y: 10 },
  { x: -36, y: -6 },
  { x: 8, y: -34 },
  { x: -14, y: 34 }
];

// How far a released piece has to end up from where it was dropped for the
// refusal to be unmistakable rather than look like a rendering wobble.
const PUZZLE_CLEARANCE = 14;

const puzzleGap = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

const puzzleTarget = (spot) => ({
  x: PUZZLE_FRAME.left + spot.column * PUZZLE_PIECE,
  y: PUZZLE_FRAME.top + spot.row * PUZZLE_PIECE
});

// Pieces stay on the board. Wandering off into the card would give the game
// away, and a piece nobody can reach is not funny, it is broken.
function puzzleClamp(point) {
  const limit = (value, max) => Math.min(Math.max(value, 0), max);
  return {
    x: limit(point.x, PUZZLE_BOARD.width - PUZZLE_PIECE),
    y: limit(point.y, PUZZLE_BOARD.height - PUZZLE_PIECE)
  };
}

// Pure. Given where the piece was dropped and where it was supposed to go,
// returns where it actually ends up: clear of the socket, clear of the drop,
// and preferably further from the socket than it already was.
function puzzleNudge(point, target, step) {
  const start = Math.abs(Math.trunc(step) || 0);
  const away = { x: point.x - target.x, y: point.y - target.y };
  const heading = away.x === 0 && away.y === 0 ? { x: 1, y: 0.4 } : away;

  const attempt = (outwardOnly) => {
    for (let index = 0; index < PUZZLE_ESCAPES.length; index += 1) {
      const escape = PUZZLE_ESCAPES[(start + index) % PUZZLE_ESCAPES.length];
      const outward = escape.x * heading.x + escape.y * heading.y >= 0;
      if (outwardOnly && !outward) continue;

      const moved = puzzleClamp({ x: point.x + escape.x, y: point.y + escape.y });
      if (puzzleGap(moved, point) > PUZZLE_CLEARANCE && puzzleGap(moved, target) > PUZZLE_CLEARANCE) {
        return moved;
      }
    }
    return null;
  };

  // Boxed into a corner with nowhere sensible to go. The opposite corner always
  // is somewhere, and it is a long way from the frame.
  return attempt(true) || attempt(false) || puzzleClamp({ x: PUZZLE_BOARD.width, y: 0 });
}

// SPEC section 6 row 5: the countdown gets unreliable at high chaos. The clock
// underneath it does not, so the auto-fail still lands at ten seconds.
function puzzleCountdownText(remaining, level) {
  if (level >= PUZZLE_UNRELIABLE_LEVEL && remaining % 3 === 1) {
    return `${remaining + 4}`;
  }
  return `${remaining}`;
}

function puzzlePlace(piece, point) {
  piece.style.left = `${point.x}px`;
  piece.style.top = `${point.y}px`;
}

function puzzleBuildPiece(spot, index) {
  const piece = document.createElement('button');
  piece.type = 'button';
  piece.className = 'puzzle-piece';
  piece.dataset.index = String(index);
  piece.setAttribute('aria-label', `Puzzle piece ${index + 1}`);

  const target = puzzleTarget(spot);
  piece.dataset.targetX = String(target.x);
  piece.dataset.targetY = String(target.y);

  // The slice of the picture this piece carries, so the four of them really do
  // make one image.
  piece.style.setProperty('--piece-x', `${-spot.column * PUZZLE_PIECE}px`);
  piece.style.setProperty('--piece-y', `${-spot.row * PUZZLE_PIECE}px`);
  puzzlePlace(piece, spot.start);

  return { piece, target };
}

function puzzleBuildSlot(spot) {
  const slot = document.createElement('span');
  slot.className = 'puzzle-slot';
  slot.setAttribute('aria-hidden', 'true');

  const target = puzzleTarget(spot);
  slot.style.left = `${target.x}px`;
  slot.style.top = `${target.y}px`;
  return slot;
}

const __default_scripts_captchas_puzzle_js = {
  id: 'puzzle',
  title: 'Assembly Verification',
  instruction: 'Slide the puzzle pieces into place.',

  render(root, ctx) {
    const stage = document.createElement('div');
    stage.className = 'puzzle-stage';

    const board = document.createElement('div');
    board.className = 'puzzle-board';

    // The finished picture, ghosted, exactly where the pieces belong.
    const frame = document.createElement('span');
    frame.className = 'puzzle-frame';
    frame.setAttribute('aria-hidden', 'true');
    frame.style.left = `${PUZZLE_FRAME.left}px`;
    frame.style.top = `${PUZZLE_FRAME.top}px`;
    board.append(frame);

    PUZZLE_LAYOUT.forEach((spot) => board.append(puzzleBuildSlot(spot)));

    const pieces = PUZZLE_LAYOUT.map((spot, index) => puzzleBuildPiece(spot, index));
    pieces.forEach((entry) => board.append(entry.piece));

    const countdown = document.createElement('p');
    countdown.className = 'puzzle-countdown';

    let remaining = PUZZLE_SECONDS;
    const paint = () => {
      countdown.textContent = `TIME REMAINING ${puzzleCountdownText(remaining, ctx.level)}s`;
    };
    paint();

    stage.append(board, countdown);
    root.append(stage);

    // --- Dragging ----------------------------------------------------------
    // Pointer events, so it works with a finger. Move and release listen on the
    // document rather than the piece, so a fast drag never loses the piece
    // halfway through the gesture.

    let held = null;
    let releases = 0;

    const onDown = (event, entry) => {
      if (event.button !== undefined && event.button > 0) return;
      if (event.preventDefault) event.preventDefault();

      held = {
        entry,
        pointerX: event.clientX,
        pointerY: event.clientY,
        origin: {
          x: parseFloat(entry.piece.style.left) || 0,
          y: parseFloat(entry.piece.style.top) || 0
        }

      if (!held) return;
      puzzlePlace(
        held.entry.piece,
        puzzleClamp({

    document.addEventListener('pointercancel', onUp);

        paint();
        return;

      ctx.reject('Assembly not completed in time.');

      clearInterval(clock);
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      document.removeEventListener('pointercancel', onUp);

    return false;
  }

// CAPTCHA 6: distorted text. SPEC.md section 6, row 6.
//
// The most convincing one, because it is exactly what a real CAPTCHA looks
// like: warped glyphs on a speckled plate, struck through with wavy lines, a
// reload button, and a box to type it into.
//
// The string is pronounceable and meaningless, so it feels readable and there
// is nothing to guess. And it is regenerated on every attempt, so whatever you
// squinted at last time is not on the screen any more.

// Consonants and vowels chosen for legibility: no letters that read as another
// letter once they are rotated and skewed.
const DISTORTED_HEADS = 'bdfghjkmnprstvz';
const DISTORTED_VOWELS = 'aeiou';
const DISTORTED_TAILS = 'bdgklmnprstxz';

// Head, vowel, tail, twice. Six glyphs is the sweet spot: long enough to look
// serious, short enough that nobody blames their own memory.
const DISTORTED_PATTERN = [DISTORTED_HEADS, DISTORTED_VOWELS, DISTORTED_TAILS];
const DISTORTED_LENGTH = 6;

// The pattern can occasionally land on a real word. A real word would give the
// visitor something to hold on to, so those seeds roll again.
const DISTORTED_WORDS = [
  'basket', 'bottle', 'button', 'candle', 'danger', 'finger', 'garden',
  'hunter', 'kitten', 'listen', 'market', 'master', 'mister', 'mitten',
  'monkey', 'murder', 'number', 'orange', 'parted', 'person', 'pocket',
  'rabbit', 'rocket', 'salmon', 'silver', 'sister', 'sunset', 'target',
  'ticket', 'tunnel', 'velvet', 'winter'
];

// Canvas plate. Drawn at twice the display size so the glyphs stay crisp.
const DISTORTED_PLATE = { width: 264, height: 84, scale: 2 };

// Lehmer again, same generator the grids use, kept local so a seed always
// produces the same plate for a given attempt.
function distortedRandom(seed) {
  let state = ((Math.trunc(seed) || 1) * 7919) % 2147483647 || 7919;
  return () => {
    state = (state * 48271) % 2147483647;
    return state / 2147483647;
  };
}

// Pure. Seed in, nonsense out. Never a word, never the same twice in a row.
function distortedTextFor(seed) {
  for (let attempt = 0; attempt < 8; attempt += 1) {
    const next = distortedRandom((Math.trunc(seed) || 0) + attempt * 613 + 1);
    let word = '';

    for (let index = 0; index < DISTORTED_LENGTH; index += 1) {
      const alphabet = DISTORTED_PATTERN[index % DISTORTED_PATTERN.length];
      const letter = alphabet[Math.floor(next() * alphabet.length)];
      // Mixed case, the way every real CAPTCHA does it.
      word += next() > 0.55 ? letter.toUpperCase() : letter;
    }

    if (!DISTORTED_WORDS.includes(word.toLowerCase())) return word;
  }

  return 'xqvtho';
}

// Paints the plate. Returns false when there is no 2d context, which is the
// case under jsdom unless a test stubs one in.
function drawDistortedText(canvas, text, level) {
  const plate = canvas.getContext ? canvas.getContext('2d') : null;
  if (!plate) return false;

  const { width, height, scale } = DISTORTED_PLATE;
  const next = distortedRandom(text.length * 977 + text.charCodeAt(0) * 31 + level);

  plate.setTransform(scale, 0, 0, scale, 0, 0);
  plate.clearRect(0, 0, width, height);
  plate.fillStyle = '#f2f4f7';
  plate.fillRect(0, 0, width, height);

  // Speckle, so the plate looks scanned rather than drawn.
  for (let dot = 0; dot < 240; dot += 1) {
    plate.fillStyle = next() > 0.5 ? 'rgba(38, 49, 61, 0.16)' : 'rgba(28, 110, 196, 0.12)';
    plate.fillRect(next() * width, next() * height, 1.6, 1.6);
  }

  // Glyphs. Each one gets its own rotation, skew, size and baseline, which is
  // what makes it read as distorted rather than as a font.
  const step = (width - 34) / text.length;
  const wobble = level >= 5 ? 1.5 : 1;

  for (let index = 0; index < text.length; index += 1) {
    const size = 32 + next() * 12;
    const tilt = (next() - 0.5) * 0.62 * wobble;
    const skew = (next() - 0.5) * 0.44 * wobble;
    const lift = (next() - 0.5) * 16 * wobble;

    plate.save();
    plate.translate(20 + index * step + step / 2, height / 2 + lift);
    plate.rotate(tilt);
    plate.transform(1, 0, skew, 1, 0, 0);
    plate.font = `700 ${size}px "Trebuchet MS", Verdana, sans-serif`;
    plate.textAlign = 'center';
    plate.textBaseline = 'middle';
    plate.fillStyle = `hsl(${210 + next() * 40} 30% ${22 + next() * 16}%)`;
    plate.fillText(text[index], 0, 0);
    plate.restore();
  }

  // Strike-through waves, drawn over the glyphs like the real thing.
  for (let line = 0; line < 4; line += 1) {
    plate.beginPath();
    plate.strokeStyle = `hsl(${200 + next() * 60} 34% 42% / 0.55)`;
    plate.lineWidth = 1 + next() * 1.4;
    plate.moveTo(0, next() * height);
    plate.quadraticCurveTo(width * 0.35, next() * height, width * 0.62, next() * height);
    plate.quadraticCurveTo(width * 0.82, next() * height, width, next() * height);
    plate.stroke();
  }

  return true;
}

// CAPTCHA 7: timer. SPEC.md section 6, row 7.
//
// A spinner, a progress bar and a big countdown, all of them working hard and
// none of them going anywhere. The number falls convincingly for a while, then
// quietly gains a few seconds back, and it never reaches zero.
//
// VERIFY is disabled here, which is the point: there is no button to fail on.
// So the challenge fails itself on a cycle instead, and the fail count still
// climbs to six and still earns the skip link. Without that this level would be
// a dead end, and a dead end is not a joke.

// The published countdown. Hand written rather than generated so the shape is
// obvious at a glance: a long believable slide, a small gift of a few seconds,
// then down again. The minimum is 6, so it never reaches zero at any tick.
const TIMER_SEQUENCE = [
  30, 29, 28, 27, 31, 26, 25, 24, 23, 29, 22, 21, 20, 19, 25, 18,
  17, 16, 15, 22, 14, 13, 12, 11, 19, 10, 9, 8, 7, 17, 6, 28
];

// SPEC section 6 row 7: it goes negative and glitches at high chaos.
const TIMER_GLITCH_LEVEL = 7;

// The first few ticks of a cycle are always honest, whatever the level, so the
// clock reads 30 and falls convincingly before the wheels come off. The
// challenge lives at level 7, and starting it already broken would give the
// whole thing away.
const TIMER_GLITCH_FROM = 4;

// Fake readouts for the glitch levels. Never a plain number, so they read as a
// fault rather than as progress.
const TIMER_GLITCH_TEXT = ['--', 'NaN', '∞', '0x1F', '???'];

// One self-rejection every eight ticks. Six of those is the skip link.
const TIMER_ATTEMPT_TICKS = 8;

const TIMER_STATUS = [
  'Contacting verification node...',
  'Analysing interaction patterns...',
  'Comparing against known humans...',
  'Awaiting confidence threshold...',
  'Re-queuing verification request...'
];

// Pure. The number on the clock at a given tick.
function timerValueFor(tick, level) {
  const index = Math.abs(Math.trunc(tick) || 0) % TIMER_SEQUENCE.length;
  const value = TIMER_SEQUENCE[index];
  if (level < TIMER_GLITCH_LEVEL || index < TIMER_GLITCH_FROM) return value;

  // From here the two ends of the sequence fight each other, which is how the
  // clock ends up on the wrong side of zero. Exactly zero is the one answer it
  // is never allowed to give, so a dead heat goes hard negative instead.
  const drift = value - TIMER_SEQUENCE[(index * 5 + 3) % TIMER_SEQUENCE.length];
  return drift === 0 ? -value : drift;
}

// Pure. What actually gets printed, which at high chaos is not always a number.
function timerDisplayFor(tick, level) {
  const index = Math.abs(Math.trunc(tick) || 0);
  if (level >= TIMER_GLITCH_LEVEL && index >= TIMER_GLITCH_FROM && index % 3 === 0) {
    return TIMER_GLITCH_TEXT[index % TIMER_GLITCH_TEXT.length];
  }
  return String(timerValueFor(index, level));
}

// The bar creeps up, resets just short of the end, and creeps up again.
function timerProgressFor(tick) {
  const index = Math.abs(Math.trunc(tick) || 0) % 24;
  return 6 + index * 3.5;
}

  });

  actions.append(attempts, verify);
  card.append(...captchaChrome(state), title, instruction, body, error, note, actions, fineprint, skipLink);

  module.render(body, {
    level: state.level,
    fails: state.fails,
    reject,
    cleanup: registerCleanup
  });

  return card;
}

function renderCaptcha(root, state, deps) {
  const screen = document.createElement('div');
  screen.className = 'screen screen-captcha';

  screen.append(captchaCard(state, deps), renderMuteToggle(state, deps));
  root.replaceChildren(screen);
  return screen;
}

// scripts/screens/placeholder.js
// Stand-in body for screens that later tasks build for real.
// Renders nothing but the screen name so the router is testable today.

function renderPlaceholder(root, name) {
  const node = document.createElement('p');
  node.className = `screen screen-${name}`;
  node.textContent = name;
  root.replaceChildren(node);
  return node;
}

// scripts/screens/gate.js
// Holy gate scene. Placeholder until T10. SPEC.md section 5.3.


function renderGate(root) {
  return renderPlaceholder(root, 'gate');
}

// scripts/main.js
// Entry point. Owns the store and the router. SPEC.md section 2 and 5.


const SCREENS = {
  won: renderWon,
  captcha: renderCaptcha,
  gate: renderGate
};

// The router is deliberately dumb: apply the chaos for the level, read
// state.screen, call the matching renderer, nothing else. `deps` carries
// everything a screen may not build for itself, so tests can inject stubs.
// Chaos runs first so a screen renders straight into the right body classes,
// and no screen ever has to know that chaos exists. The audio level is pushed
// the same way, so the music sours in step with the visuals. The mascot is
// persistent chrome rather than a screen, so it is mounted after whichever
// screen just rendered and follows the visitor from You Won into the CAPTCHA.
// The CAPTCHA cleanup registry is drained first: challenge modules park their
// timers and pointer listeners there, and none of them may survive the swap.
function createRouter(root, store, deps) {
  const render = (state) => {
    runCaptchaCleanup();
    applyChaos(root.ownerDocument || document, state.level);
    deps.audio.setLevel(state.level);
    const screen = SCREENS[state.screen](root, state, deps);
    renderMascot(root, state.level);
    return screen;
  };
  const unsubscribe = store.subscribe(render);
  render(store.getState());
  return unsubscribe;
}

function start(root, options = {}) {
  const audio = options.audio || createAudio();
  const store = createStore(createState());
  createRouter(root, store, { dispatch: store.dispatch, audio });
  return store;
}

const app = document.getElementById('app');
if (app) start(app);
</script>
