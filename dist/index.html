<!doctype html>
<html lang="en">

    <title>You Won!</title>
    <style>
/* styles/tokens.css */
/* Design tokens. SPEC.md section 8. */

:root {
  /* Kawaii palette, level 1 */
  --candy-pink: #ffb7d5;
  --candy-mint: #a8f0d8;
  --candy-lavender: #d9c2ff;
  --candy-lemon: #fff2a8;
  --candy-sky: #bde3ff;
  --ink: #5b3a53;

  /* Derived tints. Deeper cousins of the palette, for outlines and shading. */
  --pink-deep: #ff86bb;
  --mint-deep: #6fddb9;
  --lavender-deep: #b795f5;
  --cream: #fff8fb;

  /* Shape */
  --radius-blob: 32px;
  --radius-card: 20px;
  --radius-pill: 999px;

  /* Type. No web fonts: the build must run from file:// with zero requests. */
  --font-bubble: system-ui, "Trebuchet MS", Verdana, sans-serif;
  --font-chaos: "Comic Sans MS", "Comic Sans", cursive;
  --font-holy: Georgia, "Times New Roman", serif;

  /* Sticker-style layered shadows */
  --shadow-sticker: 0 6px 0 rgba(91, 58, 83, 0.18), 0 12px 24px rgba(91, 58, 83, 0.16);
  --shadow-card: 0 10px 0 rgba(255, 134, 187, 0.35), 0 22px 45px rgba(91, 58, 83, 0.22);
  --shadow-button: 0 8px 0 var(--mint-deep), 0 14px 22px rgba(91, 58, 83, 0.28);
  --shadow-button-active: 0 3px 0 var(--mint-deep), 0 6px 12px rgba(91, 58, 83, 0.26);

  /* The faked bubble outline: layered text-shadow rings, no web font needed. */
  --outline-bubble:
    -3px 0 0 var(--cream), 3px 0 0 var(--cream),
    0 -3px 0 var(--cream), 0 3px 0 var(--cream),
    -3px -3px 0 var(--cream), 3px -3px 0 var(--cream),
    -3px 3px 0 var(--cream), 3px 3px 0 var(--cream),
    0 7px 0 var(--pink-deep), 0 10px 14px rgba(91, 58, 83, 0.3);

  /* Motion */
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* styles/base.css */
/* Base layout, reset, and the shared kawaii furniture. SPEC.md section 8. */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--font-bubble);
  color: var(--ink);
  background:
    radial-gradient(120% 90% at 12% 8%, rgba(255, 242, 168, 0.85), transparent 55%),
    radial-gradient(110% 85% at 88% 12%, rgba(189, 227, 255, 0.8), transparent 55%),
    linear-gradient(165deg, var(--candy-pink) 0%, var(--candy-lavender) 48%, var(--candy-mint) 100%);
  background-attachment: fixed;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* A soft polka wash so the flat gradient reads as candy paper. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.4;
  background-image: radial-gradient(rgba(255, 255, 255, 0.75) 2px, transparent 2px);
  background-size: 34px 34px;
  background-position: 0 0;
}

#app {
  position: relative;
  min-height: 100%;
}

.screen {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: clamp(20px, 5vw, 56px);
  text-align: center;
}

button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  border: none;
  background: none;
}

/* --- Faked bubble type ----------------------------------------------------
   No web fonts are available, so the chunky look comes from a heavy system
   stack, tight tracking, and layered text-shadow rings. Each letter is its own
   span so it can sit at a slightly different angle, like stickers on a card. */

.bubble {
  display: block;
  font-weight: 900;
  letter-spacing: -0.02em;
  line-height: 0.95;
  color: var(--pink-deep);
  text-shadow: var(--outline-bubble);
}

.bubble-letter {
  display: inline-block;
  /* Spaces must not collapse when every character is its own inline-block. */
  white-space: pre;
  transform-origin: 50% 90%;
  animation: letter-pop 2.8s var(--ease-bounce) infinite;
  animation-delay: calc(var(--i) * 0.06s);
}

/* Sticker-scatter: a repeating 5-step tilt, so no letter sits perfectly level.
   nth-child keeps this to plain CSS with no per-letter inline angles. */
.bubble-letter:nth-child(5n + 1) {
  transform: rotate(-4.5deg);
}

.bubble-letter:nth-child(5n + 2) {
  transform: rotate(2.5deg) translateY(-2px);
}

.bubble-letter:nth-child(5n + 3) {
  transform: rotate(-1.5deg) translateY(1px);
}

.bubble-letter:nth-child(5n + 4) {
  transform: rotate(4.5deg);
}

.bubble-letter:nth-child(5n + 5) {
  transform: rotate(-2.5deg) translateY(-1px);
}

@keyframes letter-pop {
  0%,
  70%,
  100% {
    translate: 0 0;
  }
  78% {
    translate: 0 -7px;
  }
  86% {
    translate: 0 1px;
  }
}

/* --- Fat bouncy mint button ---------------------------------------------- */

.claim-button {
  position: relative;
  margin-top: clamp(18px, 3vw, 28px);
  padding: clamp(16px, 2.4vw, 22px) clamp(30px, 5vw, 52px);
  font-size: clamp(1.15rem, 3.4vw, 1.7rem);
  font-weight: 900;
  letter-spacing: 0.02em;
  color: #2f6b58;
  background: linear-gradient(180deg, #d6fff0 0%, var(--candy-mint) 55%, var(--mint-deep) 100%);
  border-radius: var(--radius-pill);
  box-shadow: var(--shadow-button);
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.85);
  animation: button-bounce 1.9s var(--ease-bounce) infinite;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

/* The glossy highlight that sells the candy look. */
.claim-button::before {
  content: "";
  position: absolute;
  inset: 6px 14px auto 14px;
  height: 38%;
  border-radius: var(--radius-pill);
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0));
  pointer-events: none;
}

.claim-button:hover {
  transform: translateY(-2px) scale(1.03);
}

.claim-button:active {
  transform: translateY(6px) scale(0.97);
  box-shadow: var(--shadow-button-active);
  animation-play-state: paused;
}

.claim-button:focus-visible {
  outline: 4px dashed var(--pink-deep);
  outline-offset: 6px;
}

@keyframes button-bounce {
  0%,
  100% {
    translate: 0 0;
  }
  50% {
    translate: 0 -8px;
  }
}

/* --- Mute toggle, persistent on every screen ----------------------------- */

.mute-toggle {
  position: fixed;
  top: clamp(12px, 2.5vw, 22px);
  right: clamp(12px, 2.5vw, 22px);
  z-index: 20;
  width: 52px;
  height: 52px;
  font-size: 1.4rem;
  line-height: 1;
  background: var(--cream);
  border-radius: 50%;
  box-shadow: var(--shadow-sticker);
  transition: transform 0.15s var(--ease-bounce);
}

.mute-toggle:hover {
  transform: scale(1.08) rotate(-6deg);
}

.mute-toggle:active {
  transform: scale(0.92);
}

.mute-toggle:focus-visible {
  outline: 3px dashed var(--pink-deep);
  outline-offset: 4px;
}

@media (prefers-reduced-motion: reduce) {
  .bubble-letter,
  .claim-button {
    animation: none;
  }
}

/* styles/captcha.css */
/* CAPTCHA shell. SPEC.md sections 5.2 and 6.

   The joke is the clash. Everything else on the page is candy; this is a grey
   corporate security widget with a fake trademark, a monospace session id, and
   fine print nobody reads, sitting in the middle of a children's party.

   Hard rule from SPEC section 4: `.captcha-skip` stays visible, hit-testable
   and clickable at every level in both motion modes. */

.screen-captcha {
  overflow: hidden;
}

/* --- The widget ----------------------------------------------------------- */

.captcha-card {
  position: relative;
  z-index: 2;
  display: grid;
  gap: 0;
  width: min(520px, 100%);
  padding: 0 0 18px;
  text-align: left;
  color: #26313d;
  background: #f4f6f8;
  border: 1px solid #c6ced6;
  /* Square corners and a flat drop shadow: nothing here is rounded or sweet. */
  border-radius: 4px;
  box-shadow: 0 1px 2px rgba(16, 24, 32, 0.28), 0 18px 40px rgba(91, 58, 83, 0.3);
  animation: captcha-in 0.28s ease-out both;
}

@keyframes captcha-in {
  0% {
    opacity: 0;
    translate: 0 10px;
  }
  100% {
    opacity: 1;
    translate: 0 0;
  }
}

.captcha-titlebar {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 14px;
  background: linear-gradient(180deg, #3a4653 0%, #26303a 100%);
  border-radius: 3px 3px 0 0;
}

/* The fake logo: a shield with a tick, drawn in CSS so the build stays
   dependency free and file:// clean. */
.captcha-logo {
  position: relative;
  flex: none;
  width: 24px;
  height: 27px;
  background: linear-gradient(180deg, #4da3ff 0%, #1b6fd1 100%);
  clip-path: polygon(50% 0%, 100% 18%, 100% 62%, 50% 100%, 0% 62%, 0% 18%);
}

.captcha-logo::after {
  content: "";
  position: absolute;
  top: 7px;
  left: 7px;
  width: 8px;
  height: 13px;
  border: solid #fff;
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(42deg);
}

.captcha-brand {
  font-size: 0.82rem;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: #e8eef5;
}

.captcha-heading {
  margin: 0 0 0 auto;
  font-size: 0.66rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  color: #9fb2c6;
}

.captcha-badge {
  padding: 3px 8px;
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: #063;
  background: #7ee2a8;
  border-radius: 2px;
}

.captcha-meta {
  margin: 0;
  padding: 6px 14px;
  font-family: "Consolas", "Courier New", monospace;
  font-size: 0.6rem;
  letter-spacing: 0.03em;
  color: #6b7b8c;
  background: #e6eaee;
  border-bottom: 1px solid #ccd4dc;
}

.captcha-title {
  margin: 16px 14px 2px;
  font-size: 1.02rem;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.captcha-instruction {
  margin: 0 14px 14px;
  font-size: 0.84rem;
  line-height: 1.4;
  color: #4a5865;
}

.captcha-body {
  margin: 0 14px;
  min-height: 96px;
  padding: 12px;
  background: #fff;
  border: 1px solid #d4dae1;
  border-radius: 3px;
}

/* --- Rejections ----------------------------------------------------------- */

.captcha-error {
  /* Reserved whether or not there is a message, so nothing jumps on rejection. */
  min-height: 1.2em;
  margin: 10px 14px 0;
  font-size: 0.8rem;
  font-weight: 700;
  color: #c62828;
}

.captcha-error:not(:empty) {
  animation: captcha-error-in 0.22s ease-out both;
}

.captcha-error-final {
  color: #26313d;
  letter-spacing: 0.04em;
}

@keyframes captcha-error-in {
  0% {
    translate: -4px 0;
  }
  40% {
    translate: 4px 0;
  }
  100% {
    translate: 0 0;
  }
}

.captcha-note {
  margin: 2px 14px 0;
  font-size: 0.74rem;
  color: #8a5b16;
}

.captcha-note:empty {
  display: none;
}

/* --- Actions -------------------------------------------------------------- */

.captcha-actions {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 12px 14px 0;
}

.captcha-attempts {
  font-family: "Consolas", "Courier New", monospace;
  font-size: 0.63rem;
  letter-spacing: 0.08em;
  color: #7c8b99;
}

.captcha-verify {
  padding: 9px 26px;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: #fff;
  background: linear-gradient(180deg, #3d8ee0 0%, #1c6ec4 100%);
  border: 1px solid #17599e;
  border-radius: 3px;
  transition: filter 0.12s ease;
}

.captcha-verify:hover {
  filter: brightness(1.08);
}

.captcha-verify:active {
  filter: brightness(0.92);
}

.captcha-verify:disabled {
  cursor: default;
  filter: grayscale(1) opacity(0.6);
}

.captcha-verify:focus-visible,
.captcha-skip:focus-visible {
  outline: 2px solid #1c6ec4;
  outline-offset: 2px;
}

.captcha-fineprint {
  margin: 12px 14px 0;
  font-size: 0.6rem;
  line-height: 1.45;
  color: #93a0ac;
}

/* --- Skip link ------------------------------------------------------------
   The only way out. Small and low contrast so it reads as an admission of
   defeat rather than a button, but it is a real button with a real hit area
   and it is never allowed to become unreachable. */

.captcha-skip {
  justify-self: end;
  margin: 8px 12px 0;
  /* Padding is the hit area. Keep it generous even though the text is tiny. */
  padding: 8px 10px;
  font-size: 0.68rem;
  color: #8d99a5;
  text-decoration: underline;
  background: none;
  border: none;
  border-radius: 3px;
  animation: captcha-skip-in 0.9s ease-out both;
}

.captcha-skip:hover {
  color: #46535f;
}

.captcha-skip[hidden] {
  display: none;
}

@keyframes captcha-skip-in {
  0% {
    opacity: 0;
  }
  100% {
    opacity: 0.85;
  }
}

/* --- Stub challenge body --------------------------------------------------
   Replaced by the real eight in T08 and T09. */

.stub-check {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  font-size: 0.86rem;
  cursor: pointer;
  background: #f8fafb;
  border: 1px solid #d4dae1;
  border-radius: 3px;
}

.stub-check-input {
  width: 22px;
  height: 22px;
  accent-color: #1c6ec4;
}

/* --- Challenge 1: fire ----------------------------------------------------
   SPEC section 6 row 1. A 5x5 grid that stays square at every width, so it
   still reads as a grid of photos on a 390px phone. */

.fire-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}

.fire-tile {
  display: flex;
  align-items: center;
  justify-content: center;
  /* Square cells without a fixed pixel size: the grid shrinks, it never wraps. */
  aspect-ratio: 1;
  font-size: clamp(1.1rem, 5.4vw, 1.7rem);
  line-height: 1;
  background: #f7f9fb;
  border: 1px solid #d9dfe5;
  border-radius: 4px;
  transition: background 0.12s ease, box-shadow 0.12s ease;
}

.fire-tile:hover {
  background: #eaf2fb;
}

.fire-tile-selected {
  background: #d8ebff;
  border-color: #1c6ec4;
  box-shadow: inset 0 0 0 2px #1c6ec4;
}

.fire-tile:focus-visible {
  outline: 2px solid #1c6ec4;
  outline-offset: 1px;
}

/* A brief flash on the two tiles that just traded places, so the swap reads as
   deliberate rather than as a rendering fault. */
.fire-tile-swapped {
  animation: fire-swap 0.28s ease-out;
}

@keyframes fire-swap {
  0% {
    scale: 0.72;
    filter: brightness(1.5);
  }
  100% {
    scale: 1;
    filter: none;
  }
}

/* --- Challenges 2 and 4: blurred thumbnails -------------------------------
   SPEC section 6 rows 2 and 4, and section 8: layered radial-gradients under a
   blur, no image files anywhere. */

.blob-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.blob-tile {
  position: relative;
  overflow: hidden;
  aspect-ratio: 1;
  padding: 0;
  background: #dfe5ea;
  border: 1px solid #d4dae1;
  border-radius: 3px;
}

.blob-tile:focus-visible {
  outline: 2px solid #1c6ec4;
  outline-offset: 1px;
}

/* The blur lives on the inner canvas, never on the tile, so the selection ring
   and the tick stay crisp. */
.blob-blurred .blob-canvas {
  filter: blur(6px) saturate(1.6);
}

.blob-canvas {
  position: absolute;
  /* Overdrawn so the blur has material past the edges and does not vignette. */
  inset: -14%;
  display: block;
  background:
    radial-gradient(120% 70% at 50% 108%, hsl(var(--blob-hue) 34% 42%) 0%, transparent 62%),
    radial-gradient(90% 60% at 20% 6%, hsl(var(--blob-hue-b) 62% 78%) 0%, transparent 70%),
    linear-gradient(178deg, hsl(var(--blob-hue-b) 48% 82%) 0%, hsl(var(--blob-hue) 30% 58%) 100%);
}

.blob-canvas::before,
.blob-canvas::after {
  content: "";
  position: absolute;
}

/* The almost-a-car: a low wide mass with two dark round shapes tucked under it.
   Squint and it is a hatchback in bad light. */
.blob-canvas[data-blob="pod"]::before {
  left: calc(20% + var(--blob-shift));
  right: calc(18% - var(--blob-shift));
  bottom: 28%;
  height: 26%;
  background: hsl(var(--blob-hue) 44% 34%);
  border-radius: 42% 46% 18% 18% / 78% 82% 22% 22%;
}

/* Two dark round shapes under the mass. Drawn as one band with two ellipse
   gradients rather than two nodes, since a tile only gets two pseudo-elements. */
.blob-canvas[data-blob="pod"]::after {
  left: calc(22% + var(--blob-shift));
  right: calc(20% - var(--blob-shift));
  bottom: 18%;
  height: 15%;
  background:
    radial-gradient(ellipse 15% 48% at 20% 45%, hsl(var(--blob-hue) 34% 16%) 0 99%, transparent 100%),
    radial-gradient(ellipse 15% 48% at 80% 45%, hsl(var(--blob-hue) 34% 16%) 0 99%, transparent 100%);
}

.blob-canvas[data-blob="plume"]::before {
  left: calc(34% + var(--blob-shift));
  bottom: 24%;
  width: 32%;
  height: 52%;
  background: hsl(var(--blob-hue) 40% 36%);
  border-radius: 50% 50% 40% 40% / 62% 62% 30% 30%;
}

.blob-canvas[data-blob="tower"]::before {
  left: calc(42% + var(--blob-shift));
  bottom: 20%;
  width: 16%;
  height: 62%;
  background: hsl(var(--blob-hue) 38% 32%);
  border-radius: 30% 30% 8% 8%;
}

.blob-canvas[data-blob="dunes"]::before {
  left: -10%;
  right: -10%;
  bottom: 22%;
  height: 30%;
  background: hsl(var(--blob-hue) 42% 44%);
  border-radius: 60% 40% 0 0 / 90% 70% 0 0;
}

.blob-canvas[data-blob="orb"]::before {
  left: calc(33% + var(--blob-shift));
  top: 30%;
  width: 34%;
  aspect-ratio: 1;
  background: hsl(var(--blob-hue) 46% 40%);
  border-radius: 50%;
}

.blob-canvas[data-blob="crest"]::before {
  left: calc(16% + var(--blob-shift));
  bottom: 26%;
  width: 68%;
  height: 34%;
  background: hsl(var(--blob-hue) 40% 38%);
  border-radius: 50% 8% 40% 12% / 80% 20% 40% 30%;
}

.blob-canvas[data-blob="ridge"]::before {
  left: calc(10% + var(--blob-shift));
  bottom: 24%;
  width: 80%;
  height: 40%;
  background: hsl(var(--blob-hue) 36% 40%);
  clip-path: polygon(0% 100%, 22% 26%, 44% 74%, 68% 12%, 100% 100%);
}

/* The subject in the robot grid. Blurred less than the background so it is
   just legible: legible enough to be sure none of them is a robot. */
.blob-subject {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(1.6rem, 8vw, 2.6rem);
  opacity: 0.7;
  filter: blur(2.1px) saturate(1.2);
}

.blob-check {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 18px;
  height: 18px;
  background: #1c6ec4;
  border-radius: 50%;
  opacity: 0;
  scale: 0.5;
  transition: opacity 0.12s ease, scale 0.12s ease;
}

.blob-check::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 6px;
  width: 4px;
  height: 9px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(42deg);
}

.blob-tile-selected {
  box-shadow: inset 0 0 0 3px #1c6ec4;
}

.blob-tile-selected .blob-canvas {
  scale: 0.9;
}

.blob-tile-selected .blob-check {
  opacity: 1;
  scale: 1;
}

/* --- Challenge 3: math ----------------------------------------------------
   SPEC section 6 row 3. Played straight: the sum is friendly, the buttons are
   sweet, and the answers are nonsense. */

.math-panel {
  display: grid;
  gap: 12px;
  padding: 4px 0;
}

.math-prompt {
  margin: 0;
  font-size: clamp(2rem, 11vw, 2.9rem);
  font-weight: 700;
  letter-spacing: 0.04em;
  text-align: center;
  color: #26313d;
}

.math-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
}

.math-option {
  padding: 14px 10px;
  font-size: 1rem;
  font-weight: 700;
  color: #4a3350;
  background: var(--candy-sky);
  border: 1px solid #b4d6ef;
  border-radius: 12px;
  transition: translate 0.12s ease, filter 0.12s ease;
}

.math-option:nth-child(2) {
  background: var(--candy-lavender);
  border-color: #c0a8ee;
}

.math-option:nth-child(3) {
  background: var(--candy-lemon);
  border-color: #e8d783;
}

.math-option:nth-child(4) {
  background: var(--candy-mint);
  border-color: #85d8bb;
}

.math-option:hover {
  translate: 0 -2px;
  filter: brightness(1.04);
}

.math-option-selected {
  box-shadow: inset 0 0 0 3px #1c6ec4;
}

.math-option:focus-visible {
  outline: 2px solid #1c6ec4;
  outline-offset: 2px;
}

/* --- Challenge 5: puzzle --------------------------------------------------
   SPEC section 6 row 5. One little picture cut into four, a ghost of it in the
   frame, and four dashed sockets. It looks one drag away from finished at all
   times, which is the entire point. */

.puzzle-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.puzzle-board {
  /* The picture, defined once and windowed by the frame and the four pieces so
     they really are slices of the same image. */
  --puzzle-art:
    radial-gradient(circle 15px at 92px 26px, #ffcf3f 0 100%, transparent 100%),
    radial-gradient(circle 11px at 30px 30px, #fff 0 100%, transparent 100%),
    radial-gradient(circle 15px at 46px 34px, #fff 0 100%, transparent 100%),
    radial-gradient(circle 14px at 32px 96px, #3f9e73 0 100%, transparent 100%),
    radial-gradient(4px 10px at 32px 110px, #8a6a4b 0 100%, transparent 100%),
    radial-gradient(60px 36px at 18px 126px, #58c797 0 100%, transparent 100%),
    radial-gradient(68px 44px at 100px 130px, #7fdcb3 0 100%, transparent 100%),
    linear-gradient(180deg, #8fd3ff 0%, #d5eeff 58%, #bfe9d7 100%);

  position: relative;
  flex: none;
  width: 300px;
  height: 180px;
  overflow: hidden;
  background: repeating-linear-gradient(45deg, #f6f8fa 0 8px, #eef2f6 8px 16px);
  border: 1px solid #d4dae1;
  border-radius: 3px;
}

.puzzle-frame {
  position: absolute;
  width: 120px;
  height: 120px;
  background-image: var(--puzzle-art);
  background-size: 120px 120px;
  opacity: 0.22;
  border: 2px dashed #9fb2c6;
  border-radius: 4px;
}

.puzzle-slot {
  position: absolute;
  width: 60px;
  height: 60px;
  border: 1px dashed #b7c4d1;
  border-radius: 3px;
}

.puzzle-piece {
  position: absolute;
  width: 60px;
  height: 60px;
  padding: 0;
  background-image: var(--puzzle-art);
  background-size: 120px 120px;
  background-position: var(--piece-x) var(--piece-y);
  border: 2px solid #fff;
  border-radius: 8px;
  /* The inset hairline keeps a pale quadrant reading as a piece against the
     pale board rather than dissolving into it. */
  box-shadow: 0 2px 5px rgba(16, 24, 32, 0.32), inset 0 0 0 1px rgba(38, 49, 61, 0.22);
  cursor: grab;
  /* Required, or the browser scrolls the page instead of dragging the piece. */
  touch-action: none;
}

.puzzle-piece:focus-visible {
  outline: 2px solid #1c6ec4;
  outline-offset: 2px;
}

.puzzle-piece-held {
  z-index: 3;
  cursor: grabbing;
  scale: 1.07;
  box-shadow: 0 8px 16px rgba(16, 24, 32, 0.4);
}

/* The refusal, made visible: the piece skids as it slips out of the socket. */
.puzzle-piece-slipped {
  animation: puzzle-slip 0.3s ease-out;
}

@keyframes puzzle-slip {
  0% {
    rotate: -7deg;
    scale: 1.05;
  }
  60% {
    rotate: 4deg;
  }
  100% {
    rotate: 0deg;
    scale: 1;
  }
}

.puzzle-countdown {
  margin: 0;
  font-family: "Consolas", "Courier New", monospace;
  font-size: 0.66rem;
  letter-spacing: 0.1em;
  color: #7c8b99;
}

/* --- Challenge 6: distorted text ------------------------------------------
   SPEC section 6 row 6. Canvas warped glyphs, a reload button and a box. It is
   the most familiar shape on the internet, which is why it is the hardest one
   to doubt. */

.distorted-panel {
  display: grid;
  gap: 10px;
  justify-items: center;
}

.distorted-plate {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
}

.distorted-canvas {
  flex: 1;
  min-width: 0;
  /* The canvas is drawn at 2x and displayed at 1x, so the glyphs stay sharp. */
  max-width: 264px;
  height: auto;
  background: #f2f4f7;
  border: 1px solid #d4dae1;
  border-radius: 3px;
}

.distorted-refresh {
  flex: none;
  width: 34px;
  height: 34px;
  font-size: 1.05rem;
  line-height: 1;
  color: #4a5865;
  background: #eef2f6;
  border: 1px solid #d4dae1;
  border-radius: 3px;
}

.distorted-refresh:hover {
  background: #e2e9f0;
}

.distorted-field {
  width: 100%;
}

.distorted-input {
  width: 100%;
  padding: 10px 12px;
  font-family: "Consolas", "Courier New", monospace;
  font-size: 1rem;
  letter-spacing: 0.14em;
  color: #26313d;
  background: #fff;
  border: 1px solid #b7c4d1;
  border-radius: 3px;
}

.distorted-input:focus-visible {
  outline: 2px solid #1c6ec4;
  outline-offset: 1px;
}

.distorted-hint {
  justify-self: start;
  margin: 0;
  font-size: 0.66rem;
  color: #8d99a5;
}

/* --- Challenge 7: timer ---------------------------------------------------
   SPEC section 6 row 7. Everything about this panel says "nearly there": the
   spinner turns, the bar advances, the status line changes. The number does
   not cooperate. */

.timer-panel {
  display: grid;
  gap: 12px;
  justify-items: center;
  padding: 6px 0;
}

.timer-dial {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 2px;
}

.timer-spinner {
  width: 26px;
  height: 26px;
  border: 3px solid #dce3ea;
  border-top-color: #1c6ec4;
  border-radius: 50%;
  animation: timer-spin 0.9s linear infinite;
}

@keyframes timer-spin {
  100% {
    rotate: 360deg;
  }
}

.timer-count {
  font-family: "Consolas", "Courier New", monospace;
  font-size: clamp(2.4rem, 14vw, 3.2rem);
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: 0.02em;
  color: #26313d;
  font-variant-numeric: tabular-nums;
}

.timer-unit {
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  color: #7c8b99;
}

.timer-track {
  width: 100%;
  height: 8px;
  overflow: hidden;
  background: #e6eaee;
  border-radius: 999px;
}

.timer-bar {
  display: block;
  height: 100%;
  width: 6%;
  background: linear-gradient(90deg, #4da3ff, #1c6ec4);
  border-radius: 999px;
  transition: width 0.4s ease;
}

.timer-status {
  margin: 0;
  font-size: 0.76rem;
  color: #4a5865;
}

.timer-notice {
  margin: 0;
  font-size: 0.66rem;
  color: #8d99a5;
}

/* --- Challenge 8: rotate --------------------------------------------------
   SPEC section 6 row 8. Roof on top, door on the ground, smoke going up, sun
   in the sky. There is nothing to fix, and every angle is rejected. */

.rotate-stage {
  display: grid;
  gap: 12px;
  justify-items: center;
}

.rotate-frame {
  display: grid;
  place-items: center;
  /* Wide enough to hold the 150px scene turned to 45 degrees, so no angle ever
     clips a corner off the house. */
  width: 214px;
  height: 214px;
  overflow: hidden;
  background: repeating-conic-gradient(#eef2f6 0% 25%, #f7f9fb 0% 50%) 0 / 16px 16px;
  border: 1px solid #d4dae1;
  border-radius: 3px;
}

.rotate-scene {
  position: relative;
  width: 150px;
  height: 150px;
  overflow: hidden;
  background: linear-gradient(180deg, #cfeaff 0%, #eaf7ff 100%);
  border-radius: 4px;
  rotate: var(--rotate-angle, 0deg);
  transition: rotate 0.12s ease-out;
}

.rotate-part {
  position: absolute;
}

.rotate-sun {
  top: 10px;
  right: 14px;
  width: 26px;
  height: 26px;
  background: #ffe07a;
  border-radius: 50%;
  box-shadow: 0 0 0 6px rgba(255, 224, 122, 0.35);
}

.rotate-cloud {
  top: 26px;
  left: 12px;
  width: 40px;
  height: 13px;
  background: #fff;
  border-radius: 999px;
  box-shadow: 10px -7px 0 -1px #fff, 22px -3px 0 -3px #fff;
}

.rotate-ground {
  left: 0;
  right: 0;
  bottom: 0;
  height: 34px;
  background: linear-gradient(180deg, #a8ecc8 0%, #7fdcae 100%);
}

.rotate-smoke {
  left: 90px;
  bottom: 128px;
  width: 9px;
  height: 9px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 50%;
  box-shadow:
    6px -9px 0 1px rgba(255, 255, 255, 0.75),
    13px -19px 0 3px rgba(255, 255, 255, 0.55);
}

.rotate-chimney {
  left: 92px;
  bottom: 104px;
  width: 12px;
  height: 26px;
  background: #c25b57;
  border-radius: 2px 2px 0 0;
}

.rotate-roof {
  left: 28px;
  bottom: 86px;
  width: 94px;
  height: 40px;
  background: linear-gradient(180deg, #e8837e 0%, #d4655f 100%);
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
}

.rotate-wall {
  left: 38px;
  bottom: 34px;
  width: 74px;
  height: 52px;
  background: #fff4e4;
  border: 1px solid #e6d3ba;
}

.rotate-window {
  left: 90px;
  bottom: 58px;
  width: 16px;
  height: 16px;
  background: #bde3ff;
  border: 2px solid #fff;
  border-radius: 2px;
}

.rotate-door {
  left: 62px;
  bottom: 34px;
  width: 22px;
  height: 32px;
  background: #a9744f;
  border-radius: 5px 5px 0 0;
}

.rotate-door::after {
  content: "";
  position: absolute;
  top: 15px;
  right: 4px;
  width: 4px;
  height: 4px;
  background: #ffe07a;
  border-radius: 50%;
}

.rotate-control {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.rotate-slider {
  width: 100%;
  accent-color: #1c6ec4;
}

.rotate-readout {
  font-family: "Consolas", "Courier New", monospace;
  font-size: 0.72rem;
  color: #4a5865;
}

.rotate-marks {
  display: flex;
  grid-column: 1 / 2;
  justify-content: space-between;
  font-size: 0.58rem;
  letter-spacing: 0.06em;
  color: #9fb2c6;
}

/* --- Chaos overrides ------------------------------------------------------
   The widget is the last thing on the page still pretending to be serious, so
   it loses its composure a level later than everything else. */

body.fx-comicSans .captcha-meta,
body.fx-comicSans .captcha-attempts {
  font-family: "Consolas", "Courier New", monospace;
}

body.fx-neon .captcha-card {
  color: #f2f6ff;
  background: #1b1030;
  border-color: var(--candy-pink);
}

body.fx-neon .captcha-body {
  color: #1b1030;
}

body.fx-neon .captcha-instruction,
body.fx-neon .captcha-fineprint,
body.fx-neon .captcha-attempts {
  color: #d9c2ff;
}

/* Under fx-dodge the link drifts, but only inside a bounded box that keeps it
   over the card and comfortably larger than the pointer. chaos.js may also
   nudge it once, and `.fx-dodged` turns this animation off when it does. */
body.fx-dodge .captcha-skip {
  animation:
    captcha-skip-in 0.9s ease-out both,
    captcha-skip-drift 7s ease-in-out 0.9s infinite;
}

@keyframes captcha-skip-drift {
  0%,
  100% {
    translate: 0 0;
  }
  25% {
    translate: -14px -6px;
  }
  50% {
    translate: 10px 4px;
  }
  75% {
    translate: -6px 5px;
  }
}

/* Once the card goes dark the link stops hiding. It is the only exit and it has
   to survive strobe, invert and spin, so from here contrast goes up, not down.
   Keyed off fx-neon rather than fx-overdrive because fx-neon is not a motion
   flag: this has to hold in reduced motion too. */
body.fx-neon .captcha-skip {
  color: #26313d;
  background: #fff;
  box-shadow: 0 0 0 1px #26313d;
}

@media (max-width: 420px) {
  .captcha-heading {
    display: none;
  }

  /* The heading carried the spacer, so the badge takes it over. */
  .captcha-badge {
    margin-left: auto;
  }

  .captcha-meta {
    font-size: 0.54rem;
  }

  /* The grids keep their shape at 390px: the 5x5 stays square and shrinks, the
     3x3 stays three wide. Only the gaps and the body padding give way. */
  .captcha-body {
    padding: 8px;
  }

  .fire-grid,
  .blob-grid {
    gap: 4px;
  }

  /* The puzzle board and the rotate frame are fixed pixel sizes, so at 390px
     they get the padding back rather than being allowed to overflow. */
  .puzzle-stage,
  .rotate-stage {
    margin: 0 -4px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .captcha-card,
  .captcha-error:not(:empty),
  .fire-tile-swapped,
  .puzzle-piece-slipped,
  body.fx-dodge .captcha-skip {
    animation: none;
  }

  /* The spinner keeps its ring, it just stops turning. The bar and the scene
     jump straight to their new values. */
  .timer-spinner {
    animation: none;
  }

  .timer-bar,
  .rotate-scene {
    transition: none;
  }

  /* Belt and braces: the swap is already withheld by the chaos flag, and the
     hover lift goes too. */
  .math-option:hover {
    translate: none;
  }

  .captcha-skip {
    animation: none;
    opacity: 0.85;
  }
}

/* styles/chaos.css */
/* Chaos. One block per flag from SPEC.md section 4, all scoped under
   body.fx-<flag>. The flags are cumulative, so every block has to survive being
   stacked on top of the ones before it.

   Hard rule: nothing in here may make an interactive element unclickable.
   Every decorative layer carries `pointer-events: none` and every control that
   moves, moves by a small, bounded amount that keeps it on screen. */

body {
  /* Overdrive multiplies every chaos duration through this one knob. */
  --fx-speed: 1;
  --fx-dodge-x: 0px;
  --fx-dodge-y: 0px;
}

/* --- Level 2: tilt --------------------------------------------------------
   The first thing that is quietly wrong. Nothing is level any more, and the
   page has not noticed. */

body.fx-tilt .won-card {
  rotate: -3.2deg;
}

body.fx-tilt .won-ribbon {
  rotate: 4deg;
}

body.fx-tilt .won-prize {
  rotate: -3deg;
}

body.fx-tilt .claim-button {
  rotate: 2.4deg;
}

body.fx-tilt .mute-toggle {
  rotate: -8deg;
}

body.fx-tilt .captcha-card,
body.fx-tilt .fx-tiltable {
  rotate: 1.8deg;
}

/* --- Level 2: saturate ----------------------------------------------------
   Ten percent too much. Reads as "nice screen" rather than "broken screen",
   which is the point. */

body.fx-saturate #app {
  filter: saturate(1.12);
}

/* --- Level 3: comicSans ---------------------------------------------------
   The moment the page stops being trustworthy. */

body.fx-comicSans,
body.fx-comicSans * {
  font-family: var(--font-chaos);
}

body.fx-comicSans .bubble {
  letter-spacing: 0.01em;
}

/* --- Level 3 and 8: cursor trail ------------------------------------------
   Sparkles chase the pointer. The layer is inert; each sparkle deletes itself
   when its animation ends, and chaos.js drops the whole layer with the flag. */

.fx-trail-layer {
  position: fixed;
  inset: 0;
  z-index: 60;
  overflow: hidden;
  pointer-events: none;
}

.fx-trail-dot {
  position: absolute;
  line-height: 1;
  pointer-events: none;
  translate: -50% -50%;
  animation: fx-trail-fade calc(0.75s * var(--fx-speed)) ease-out forwards;
}

/* Level 3: a polite little sparkle, sized like a cursor decoration. */
body.fx-cursorTrail .fx-trail-dot {
  font-size: 1.05rem;
}

@keyframes fx-trail-fade {
  0% {
    opacity: 1;
    scale: 0.6;
    rotate: 0deg;
  }
  100% {
    opacity: 0;
    scale: 1.6;
    rotate: 90deg;
    translate: calc(-50% + var(--fx-drift, 0px)) calc(-50% + 26px);
  }
}

/* Level 8 turns the polite sparkle into a smear. */
body.fx-trails .fx-trail-dot {
  font-size: 1.7rem;
  filter: drop-shadow(0 0 8px var(--candy-lemon));
  animation-duration: calc(1.1s * var(--fx-speed));
}

/* --- Level 4: shake -------------------------------------------------------
   Small, fast, constant. Reading is still possible. Comfort is not. */

body.fx-shake #app {
  animation: fx-shake calc(0.32s * var(--fx-speed)) linear infinite;
}

@keyframes fx-shake {
  0%,
  100% {
    translate: 0 0;
    rotate: 0deg;
  }
  25% {
    translate: -3px 2px;
    rotate: -0.35deg;
  }
  50% {
    translate: 2px -3px;
    rotate: 0.3deg;
  }
  75% {
    translate: 3px 1px;
    rotate: 0.4deg;
  }
}

/* --- Level 4: neon --------------------------------------------------------
   The candy palette is replaced token by token, so every component that reads
   the tokens turns acid without knowing why. */

body.fx-neon {
  --candy-pink: #ff2fa0;
  --candy-mint: #29ffc6;
  --candy-lavender: #a44bff;
  --candy-lemon: #fbff2b;
  --candy-sky: #2be2ff;
  --pink-deep: #ff0a86;
  --mint-deep: #00d9a3;
  --cream: #fff4ff;
}

body.fx-neon .won-card,
body.fx-neon .captcha-card {
  box-shadow:
    0 0 0 4px rgba(255, 47, 160, 0.5),
    0 0 26px rgba(43, 226, 255, 0.75),
    var(--shadow-card);
}

body.fx-neon .bubble {
  text-shadow:
    0 0 6px var(--candy-sky),
    0 0 18px var(--candy-pink),
    var(--outline-bubble);
}

body.fx-neon .claim-button {
  box-shadow: 0 8px 0 var(--mint-deep), 0 0 28px var(--candy-mint);
}

/* --- Level 5: backwards ---------------------------------------------------
   Only the small print and anything explicitly marked. The headline stays
   readable, so it takes a second to notice. */

body.fx-backwards [data-flip],
body.fx-backwards .won-label,
body.fx-backwards .won-fineprint,
body.fx-backwards .captcha-instruction {
  display: inline-block;
  transform: scaleX(-1);
}

/* --- Level 5: popups ------------------------------------------------------
   Fake dismissible junk windows. The layer is inert and the cards park in the
   left and right margins, so the prize card and the skip link stay clear. */

.fx-popup-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

/* Under the mute toggle and under the trail, above the page. Junk windows are
   junk, they do not get to own the top of the stack. */
body.fx-popups .fx-popup-layer {
  z-index: 15;
}

.fx-popup {
  position: absolute;
  left: var(--fx-popup-x, 10%);
  top: var(--fx-popup-y, 20%);
  width: min(230px, 42vw);
  padding: 0 0 12px;
  color: var(--ink);
  background: var(--cream);
  border: 3px solid var(--pink-deep);
  border-radius: var(--radius-card);
  box-shadow: var(--shadow-sticker);
  rotate: var(--fx-popup-tilt, 0deg);
  pointer-events: auto;
  animation: fx-popup-in calc(0.35s * var(--fx-speed)) var(--ease-bounce) both;
}

@keyframes fx-popup-in {
  0% {
    opacity: 0;
    scale: 0.7;
  }
  100% {
    opacity: 1;
    scale: 1;
  }
}

.fx-popup-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 6px 6px 12px;
  background: linear-gradient(180deg, var(--candy-sky), var(--candy-lavender));
  border-radius: 14px 14px 0 0;
}

.fx-popup-title {
  font-size: 0.66rem;
  font-weight: 900;
  letter-spacing: 0.1em;
}

.fx-popup-close {
  width: 24px;
  height: 24px;
  font-size: 1rem;
  line-height: 1;
  background: var(--cream);
  border-radius: 8px;
  box-shadow: 0 2px 0 rgba(91, 58, 83, 0.25);
}

.fx-popup-body {
  margin: 12px 14px;
  font-size: 0.75rem;
  line-height: 1.35;
}

.fx-popup-cta {
  margin: 0 14px;
  padding: 7px 16px;
  font-size: 0.7rem;
  font-weight: 900;
  color: #2f6b58;
  background: linear-gradient(180deg, #d6fff0, var(--candy-mint));
  border-radius: var(--radius-pill);
  box-shadow: 0 3px 0 var(--mint-deep);
}

.fx-popup-close:focus-visible,
.fx-popup-cta:focus-visible {
  outline: 3px dashed var(--pink-deep);
  outline-offset: 3px;
}

/* --- Level 5: hypercolor --------------------------------------------------
   The grade stops being flattering and starts being a warning. */

body.fx-hypercolor #app {
  filter: saturate(2.4) contrast(1.18);
  animation: fx-hue-drift calc(9s * var(--fx-speed)) linear infinite;
}

@keyframes fx-hue-drift {
  0%,
  100% {
    filter: saturate(2.4) contrast(1.18) hue-rotate(-14deg);
  }
  50% {
    filter: saturate(2.8) contrast(1.25) hue-rotate(16deg);
  }
}

/* --- Level 6: glitch ------------------------------------------------------
   RGB split on the type, scanlines and a rolling tear over everything. The
   overlay is fixed and inert. */

body.fx-glitch .bubble,
body.fx-glitch .won-prize,
body.fx-glitch .captcha-title {
  animation: fx-rgb-split calc(2.4s * var(--fx-speed)) steps(1, end) infinite;
}

@keyframes fx-rgb-split {
  0%,
  62%,
  100% {
    text-shadow: var(--outline-bubble);
    translate: 0 0;
  }
  66% {
    text-shadow: -4px 0 0 #ff004c, 4px 0 0 #00e5ff;
    translate: 3px 0;
  }
  70% {
    text-shadow: 5px 0 0 #ff004c, -5px 0 0 #00e5ff;
    translate: -4px 0;
  }
  74% {
    text-shadow: -2px 2px 0 #ff004c, 2px -2px 0 #00e5ff;
    translate: 2px -1px;
  }
}

.fx-glitch-overlay {
  position: fixed;
  inset: 0;
  z-index: 65;
  opacity: 0.55;
  pointer-events: none;
  mix-blend-mode: overlay;
  background-image: repeating-linear-gradient(
    180deg,
    rgba(0, 0, 0, 0.22) 0 1px,
    transparent 1px 4px
  );
}

/* The tear that sweeps down the page every few seconds. */
.fx-glitch-overlay::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 14vh;
  pointer-events: none;
  background: linear-gradient(
    180deg,
    transparent,
    rgba(0, 229, 255, 0.35),
    rgba(255, 0, 76, 0.3),
    transparent
  );
  animation: fx-glitch-roll calc(3.6s * var(--fx-speed)) linear infinite;
}

@keyframes fx-glitch-roll {
  0% {
    top: -20vh;
  }
  100% {
    top: 110vh;
  }
}

/* --- Level 6: dodge -------------------------------------------------------
   A control jumps aside the first time the pointer arrives, then gives up.
   The offset is small and bounded and the hit area moves with the element, so
   the second approach always connects. chaos.js never dodges twice. */

.fx-dodged {
  translate: var(--fx-dodge-x, 0px) var(--fx-dodge-y, 0px);
  animation: none;
  transition: translate calc(0.18s * var(--fx-speed)) var(--ease-bounce);
}

/* --- Level 7: strobe ------------------------------------------------------
   Withheld under reduced motion. Kept well below full white so text stays
   legible through every flash. */

.fx-strobe-overlay {
  position: fixed;
  inset: 0;
  z-index: 70;
  opacity: 0;
  pointer-events: none;
  background: #fff;
  animation: fx-strobe calc(0.34s * var(--fx-speed)) steps(1, end) infinite;
}

@keyframes fx-strobe {
  0%,
  49% {
    opacity: 0;
    background: #fff;
  }
  50%,
  74% {
    opacity: 0.4;
    background: #fff;
  }
  75%,
  100% {
    opacity: 0.22;
    background: var(--candy-lemon);
  }
}

/* --- Level 7: invert ------------------------------------------------------
   A periodic photo-negative pulse over the whole document. It sits on <body>
   so it never fights the colour grade filter on #app. */

body.fx-invert {
  animation: fx-invert-pulse calc(5s * var(--fx-speed)) steps(1, end) infinite;
}

@keyframes fx-invert-pulse {
  0%,
  78%,
  100% {
    filter: none;
  }
  80%,
  86% {
    filter: invert(1) hue-rotate(180deg);
  }
  88% {
    filter: none;
  }
  90%,
  94% {
    filter: invert(1);
  }
}

/* --- Level 7: spin --------------------------------------------------------
   The horizon stops being reliable. Slow enough to feel like your own balance
   rather than the page. Scaled up slightly so the rotated corners never expose
   an empty edge. */

body.fx-spin .screen {
  animation: fx-spin-drift calc(19s * var(--fx-speed)) ease-in-out infinite;
}

/* The rotation carries the corner controls with it, so they get pulled inboard
   far enough that no swing of the drift can push them past an edge. */
body.fx-spin .mute-toggle {
  top: clamp(48px, 7vw, 76px);
  right: clamp(48px, 7vw, 76px);
}

@keyframes fx-spin-drift {
  0%,
  100% {
    rotate: -2.6deg;
    scale: 1.03;
  }
  50% {
    rotate: 2.6deg;
    scale: 1.03;
  }
}

/* --- Level 8: overdrive ---------------------------------------------------
   The same show played at triple speed. One variable drives every chaos
   animation, plus explicit overrides for the sweet level 1 decoration that
   never expected to be run this hard. */

body.fx-overdrive {
  --fx-speed: 0.34;
}

body.fx-overdrive .confetti-piece {
  animation-duration: 1.6s;
}

body.fx-overdrive .balloon {
  animation-duration: 3.4s;
}

body.fx-overdrive .bubble-letter {
  animation-duration: 0.5s;
}

body.fx-overdrive .claim-button {
  animation-duration: 0.32s;
}

body.fx-overdrive .bubble {
  letter-spacing: -0.05em;
}

body.fx-overdrive .won-card {
  box-shadow:
    0 0 0 6px var(--candy-lemon),
    0 0 40px var(--candy-pink),
    var(--shadow-card);
}

/* --- Mascot hooks ---------------------------------------------------------
   The mascot is drawn in mascot.css. These blocks are the flag half of the
   degradation: it appears, its eyes drift, its voice sours, its smile flips,
   and finally its text stops being text. */

body.fx-mascot .mascot {
  opacity: 1;
}

body.fx-eyeDrift .mascot-eye-left {
  translate: -6px 2px;
}

body.fx-eyeDrift .mascot-eye-right {
  translate: 7px -3px;
}

body.fx-mascotSnark .mascot-speech {
  color: #b0407c;
  font-style: italic;
}

body.fx-mascotInvert .mascot-mouth {
  transform: scaleY(-1);
}

body.fx-mascotCorrupt .mascot-speech {
  font-family: var(--font-chaos);
  color: #ff004c;
  text-shadow: -2px 0 0 #00e5ff, 2px 0 0 #ff004c;
}

/* --- Reduced motion -------------------------------------------------------
   MOTION_FLAGS are already withheld in chaos.js, so this is a second pass over
   the effects that keep their class but still animate. Colour, typography,
   backwards text, popups, the glitch grade, and the mascot all stay: the joke
   survives, the vestibular system is left out of it. */

@media (prefers-reduced-motion: reduce) {
  body.fx-hypercolor #app,
  body.fx-glitch .bubble,
  body.fx-glitch .won-prize,
  body.fx-glitch .captcha-title,
  .fx-glitch-overlay::after,
  .fx-popup {
    animation: none;
  }

  body.fx-hypercolor #app {
    filter: saturate(2.4) contrast(1.18) hue-rotate(-14deg);
  }

  body.fx-glitch .bubble {
    text-shadow: -3px 0 0 #ff004c, 3px 0 0 #00e5ff;
  }
}

/* styles/gate.css */
/* Holy gate scene. Filled in by T10. */

/* styles/mascot.css */
/* The mascot. SPEC.md section 4 (mascot flags) and section 5.

   Drawn entirely in CSS: a rounded blob body, two eyes, brows, a mouth arc, and
   blush circles. Level 1 never renders it at all. From level 2 the chaos flags
   take it apart one stage at a time.

   Hard rule from SPEC section 4: it never covers a control. The whole widget is
   `pointer-events: none`, it lives in the bottom left corner away from the
   CLAIM button, the mute toggle, and the skip link, and it shrinks on small
   viewports so it stays out of the card at 390px. */

.mascot {
  position: fixed;
  left: clamp(10px, 2.5vw, 26px);
  bottom: clamp(10px, 2.5vw, 26px);
  z-index: 12;
  display: flex;
  flex-direction: row-reverse;
  align-items: flex-end;
  gap: 10px;
  max-width: min(360px, 62vw);
  /* Decoration only: every click goes straight through to whatever is under it. */
  pointer-events: none;
  /* chaos.css raises this to 1 with `fx-mascot`, so it fades in at loop 2. */
  opacity: 0;
  transition: opacity 0.6s ease;
}

/* --- Body ----------------------------------------------------------------- */

.mascot-body {
  position: relative;
  flex: none;
  width: 92px;
  height: 84px;
  background:
    radial-gradient(70% 60% at 32% 26%, rgba(255, 255, 255, 0.95), transparent 70%),
    linear-gradient(180deg, var(--cream) 0%, var(--candy-sky) 100%);
  border: 4px solid #fff;
  border-radius: 52% 48% 46% 54% / 58% 56% 44% 42%;
  box-shadow: var(--shadow-sticker);
  animation: mascot-breathe 3.4s var(--ease-bounce) infinite;
}

/* A little tuft, so the blob reads as a creature rather than a stone. */
.mascot-body::before {
  content: "";
  position: absolute;
  top: -14px;
  left: 50%;
  width: 10px;
  height: 16px;
  margin-left: -5px;
  background: var(--candy-pink);
  border: 3px solid #fff;
  border-radius: 50% 50% 40% 40%;
}

@keyframes mascot-breathe {
  0%,
  100% {
    translate: 0 0;
    scale: 1 1;
  }
  50% {
    translate: 0 -5px;
    scale: 1.03 0.97;
  }
}

.mascot-eye {
  position: absolute;
  top: 28px;
  width: 13px;
  height: 16px;
  background: var(--ink);
  border-radius: 50%;
  transition: translate 0.5s var(--ease-bounce), rotate 0.5s ease;
}

/* The glint. Removed at `fx-mascotSnark`, which is most of the mood change. */
.mascot-eye::after {
  content: "";
  position: absolute;
  top: 3px;
  left: 3px;
  width: 5px;
  height: 5px;
  background: #fff;
  border-radius: 50%;
}

.mascot-eye-left {
  left: 20px;
}

.mascot-eye-right {
  right: 20px;
}

.mascot-brow {
  position: absolute;
  top: 19px;
  width: 16px;
  height: 4px;
  background: var(--ink);
  border-radius: var(--radius-pill);
  opacity: 0;
  transition: opacity 0.4s ease, rotate 0.4s ease;
}

.mascot-brow-left {
  left: 18px;
}

.mascot-brow-right {
  right: 18px;
}

.mascot-blush {
  position: absolute;
  top: 42px;
  width: 15px;
  height: 10px;
  background: var(--candy-pink);
  border-radius: 50%;
  opacity: 0.85;
}

.mascot-blush-left {
  left: 9px;
}

.mascot-blush-right {
  right: 9px;
}

/* A smile: the bottom half of a ring. `fx-mascotInvert` flips it with
   scaleY(-1), which is why nothing else here uses `transform`. */
.mascot-mouth {
  position: absolute;
  top: 50px;
  left: 50%;
  width: 26px;
  height: 13px;
  margin-left: -13px;
  border: 3px solid var(--ink);
  border-top: none;
  border-radius: 0 0 26px 26px;
  transition: rotate 0.4s ease;
}

/* --- Speech bubble -------------------------------------------------------- */

.mascot-speech {
  position: relative;
  margin: 0 0 14px;
  padding: 10px 14px;
  font-size: 0.78rem;
  font-weight: 700;
  line-height: 1.35;
  text-align: left;
  color: var(--ink);
  background: var(--cream);
  border: 3px solid #fff;
  border-radius: 16px 16px 16px 4px;
  box-shadow: var(--shadow-sticker);
  animation: mascot-pop 0.45s var(--ease-bounce) both;
}

/* The tail, pointing down and left at the blob. */
.mascot-speech::after {
  content: "";
  position: absolute;
  bottom: -11px;
  left: 12px;
  width: 0;
  height: 0;
  border-top: 12px solid var(--cream);
  border-right: 12px solid transparent;
}

@keyframes mascot-pop {
  0% {
    opacity: 0;
    scale: 0.8;
  }
  100% {
    opacity: 1;
    scale: 1;
  }
}

/* --- Degradation ----------------------------------------------------------
   Keyed off the chaos flags, never off the level. chaos.css owns the drift
   offsets, the snark colour, the mouth flip, and the corrupt type; these blocks
   carry the rest of each stage. */

/* Level 3: one eye lags behind the other, which is quietly awful. */
body.fx-eyeDrift .mascot-eye-right {
  transition-duration: 1.6s;
}

/* Level 4: brows arrive, the glint goes, the colour drains. */
body.fx-mascotSnark .mascot-brow {
  opacity: 1;
}

body.fx-mascotSnark .mascot-brow-left {
  rotate: 16deg;
}

body.fx-mascotSnark .mascot-brow-right {
  rotate: -16deg;
}

body.fx-mascotSnark .mascot-eye::after {
  opacity: 0;
}

body.fx-mascotSnark .mascot-body {
  filter: saturate(0.5);
}

body.fx-mascotSnark .mascot-blush {
  opacity: 0.35;
}

/* The smile flattens into a line before it ever inverts. */
body.fx-mascotSnark .mascot-mouth {
  height: 5px;
  width: 22px;
  margin-left: -11px;
}

/* Level 6: the smile inverts (chaos.css) and the whole thing sags. */
body.fx-mascotInvert .mascot-body {
  filter: saturate(0.3) brightness(0.92);
  border-radius: 48% 52% 58% 42% / 46% 44% 58% 60%;
  animation-duration: 6.5s;
}

body.fx-mascotInvert .mascot-eye {
  height: 12px;
  rotate: 8deg;
}

body.fx-mascotInvert .mascot-speech {
  border-radius: 4px;
}

/* Level 8: the features detach and jitter and the body loses its hue. */
body.fx-mascotCorrupt .mascot-body {
  animation: mascot-corrupt-body calc(1.1s * var(--fx-speed)) steps(2, end) infinite;
}

body.fx-mascotCorrupt .mascot-eye-left {
  animation: mascot-corrupt-eye calc(0.42s * var(--fx-speed)) steps(2, end) infinite;
}

body.fx-mascotCorrupt .mascot-eye-right {
  animation: mascot-corrupt-eye calc(0.31s * var(--fx-speed)) steps(2, end) infinite reverse;
}

body.fx-mascotCorrupt .mascot-mouth {
  animation: mascot-corrupt-mouth calc(0.7s * var(--fx-speed)) steps(2, end) infinite;
}

/* The strike marks need room, otherwise the line reads as a solid bar. */
body.fx-mascotCorrupt .mascot-speech {
  letter-spacing: 0.06em;
  word-spacing: 0.2em;
}

body.fx-mascotCorrupt .mascot-blush {
  opacity: 0.9;
  background: #ff004c;
}

@keyframes mascot-corrupt-body {
  0%,
  100% {
    filter: hue-rotate(0deg) contrast(1.1);
    translate: 0 0;
  }
  50% {
    filter: hue-rotate(200deg) contrast(1.5);
    translate: 3px -2px;
  }
}

@keyframes mascot-corrupt-eye {
  0%,
  100% {
    translate: -9px 6px;
  }
  50% {
    translate: 11px -8px;
  }
}

@keyframes mascot-corrupt-mouth {
  0%,
  100% {
    translate: 5px 7px;
    rotate: -12deg;
  }
  50% {
    translate: -7px -4px;
    rotate: 14deg;
  }
}

/* --- Responsive -----------------------------------------------------------
   At 390px the card fills the width, so the mascot shrinks and the bubble
   stacks above the blob rather than reaching toward the middle of the screen. */

@media (max-width: 560px) {
  .mascot {
    flex-direction: column;
    align-items: flex-start;
    gap: 0;
    max-width: 58vw;
  }

  .mascot-speech {
    margin-bottom: 8px;
    font-size: 0.68rem;
  }

  .mascot-body {
    width: 68px;
    height: 62px;
  }

  .mascot-eye {
    top: 20px;
    width: 10px;
    height: 12px;
  }

  .mascot-eye-left {
    left: 14px;
  }

  .mascot-eye-right {
    right: 14px;
  }

  .mascot-brow {
    top: 13px;
    width: 12px;
  }

  .mascot-brow-left {
    left: 13px;
  }

  .mascot-brow-right {
    right: 13px;
  }

  .mascot-blush {
    top: 31px;
    width: 11px;
    height: 8px;
  }

  .mascot-blush-left {
    left: 6px;
  }

  .mascot-blush-right {
    right: 6px;
  }

  .mascot-mouth {
    top: 36px;
    width: 19px;
    height: 10px;
    margin-left: -9.5px;
  }
}

/* Short viewports have no room for a bubble in the corner: keep the blob and
   drop the speech, so nothing is pushed over the card. */
@media (max-height: 520px) {
  .mascot-speech {
    display: none;
  }
}

/* Reduced motion keeps every stage of the decline, it just stops it twitching.
   The corrupt mascot holds a static broken pose instead of jittering. */
@media (prefers-reduced-motion: reduce) {
  .mascot-body,
  .mascot-speech,
  body.fx-mascotCorrupt .mascot-body,
  body.fx-mascotCorrupt .mascot-eye-left,
  body.fx-mascotCorrupt .mascot-eye-right,
  body.fx-mascotCorrupt .mascot-mouth {
    animation: none;
  }

  body.fx-mascotCorrupt .mascot-body {
    filter: hue-rotate(200deg) contrast(1.4);
  }

  body.fx-mascotCorrupt .mascot-eye-left {
    translate: -9px 6px;
  }

  body.fx-mascotCorrupt .mascot-eye-right {
    translate: 11px -8px;
  }

  body.fx-mascotCorrupt .mascot-mouth {
    translate: 5px 7px;
    rotate: -12deg;
  }
}

    <script type="module">
// scripts/state.js
// Pure state core. SPEC.md section 2 and 3.
// Every transition returns a new object and never mutates its input.
// No DOM, no imports.

const CAPTCHA_ORDER = [
  'fire', 'images', 'math', 'robot',
  'puzzle', 'distortedText', 'timer', 'rotate'
];

const MAX_LEVEL = 8;
const SKIP_THRESHOLD = 6;

function createState() {
  return {
    screen: 'won',
    level: 1,
    fails: 0,
    muted: false,
    audioStarted: false
  };
}

// CLAIM PRIZE. Only meaningful from the You Won screen.
function claim(state) {
  if (state.screen !== 'won') return { ...state };
  return { ...state, screen: 'captcha', fails: 0 };
}

// A rejection. Counts up and nothing else, forever.
function fail(state) {
  if (state.screen !== 'captcha') return { ...state };
  return { ...state, fails: state.fails + 1 };
}

// The only way out of a CAPTCHA. Level 8 opens the gate instead of looping.
function skip(state) {
  if (state.screen !== 'captcha') return { ...state };
  if (state.level >= MAX_LEVEL) return { ...state, screen: 'gate' };
  return { ...state, screen: 'won', level: state.level + 1, fails: 0 };
}

// Back to a pristine loop 1. The mute choice and the live AudioContext survive.
function reset(state) {
  return { ...createState(), muted: state.muted, audioStarted: state.audioStarted };
}

function captchaFor(state) {
  return CAPTCHA_ORDER[state.level - 1];
}

function canSkip(state) {
  return state.fails >= SKIP_THRESHOLD;
}

// scripts/store.js
// Tiny observable holding the current state. SPEC.md section 3.
// dispatch takes a pure transition from state.js and applies it.

function createStore(initial) {
  let current = initial;
  let listeners = [];

  const getState = () => current;

  const dispatch = (transition) => {
    current = transition(current);
    listeners.forEach((listener) => listener(current));
    return current;
  };

  const subscribe = (listener) => {
    listeners = [...listeners, listener];
    return () => {
      listeners = listeners.filter((entry) => entry !== listener);
    };
  };

  return { getState, dispatch, subscribe };
}

// scripts/audio.js
// Audio engine. SPEC.md section 7. Web Audio, oscillators only, no files and
// no network. Nothing is constructed until the first CLAIM PRIZE click, so the
// page never trips the browser autoplay warning on load.
//
// Everything routes through one master gain, which is the only thing mute
// touches. Mute is never part of the prank: people run this at a desk.

const MAX_AUDIO_LEVEL = 8;

// Conservative on purpose. The app is already annoying.
const MASTER_GAIN = 0.16;
const NOTE_GAIN = 0.5;
const BLIP_GAIN = 0.45;
const BUZZ_GAIN = 0.4;
const PAD_GAIN = 0.6;
const MUTE_RAMP = 0.06;

// A sweet little toy phrase in C major, as semitone offsets from C5.
const MELODY = [0, 4, 7, 12, 9, 7, 4, 7, 5, 4, 2, 4, 0, 4, 7, 4];
const MELODY_ROOT = 523.25;

// Per-note detune shape. Multiplied by detuneFor(level), so level 1 is dead in
// tune and level 8 wobbles sharp and flat around every note.
const DETUNE_SHAPE = [0, 1, -0.6, 0.8, -1, 0.4, -0.8, 1, -0.5, 0.9, -1, 0.6, 0, -0.9, 1, -0.7];

const HOLY_CHORD = [261.63, 329.63, 392.0, 523.25];

const clampAudioLevel = (level) =>
  Math.min(Math.max(Math.trunc(level) || 1, 1), MAX_AUDIO_LEVEL);

// Seconds per note. Sweet and unhurried at level 1, twitchy by level 8.
function tempoFor(level) {
  return 0.26 - (clampAudioLevel(level) - 1) * 0.022;
}

// Peak detune in cents. Zero at level 1, and by level 8 the worst notes sit
// most of a semitone out, which is sour without losing the tune entirely.
function detuneFor(level) {
  return (clampAudioLevel(level) - 1) * 12;
}

function createAudio({ AudioContextCtor = globalThis.AudioContext } = {}) {
  let ctx = null;
  let master = null;
  let musicBus = null;
  let level = 1;
  let muted = false;
  let timer = null;
  let step = 0;

  const isStarted = () => ctx !== null;
  const now = () => ctx.currentTime;

  // A one-shot voice: oscillator into its own gain envelope, then the given
  // bus. Nothing is reused, so nothing has to be cleaned up by hand.
  const voice = (type, frequency, detune, bus) => {
    const osc = ctx.createOscillator();
    const gate = ctx.createGain();

    osc.type = type;
    osc.frequency.setValueAtTime(frequency, now());
    osc.detune.setValueAtTime(detune, now());
    osc.connect(gate);
    gate.connect(bus);

    return { osc, gate };
  };

  // Attack up to peak, then straight back down to silence. Linear ramps only,
  // so a target of 0 is always legal.
  const shape = (param, peak, attack, duration) => {
    const at = now();
    param.setValueAtTime(0, at);
    param.linearRampToValueAtTime(peak, at + attack);
    param.linearRampToValueAtTime(0, at + duration);
  };

  const playNote = () => {
    const index = step % MELODY.length;
    step += 1;

    const semitones = MELODY[index];
    const frequency = MELODY_ROOT * 2 ** (semitones / 12);
    const detune = DETUNE_SHAPE[index] * detuneFor(level);
    const duration = tempoFor(level) * 0.9;

    // Triangle reads as a music box; square reads as a cheap toy losing it.
    const { osc, gate } = voice(
      level >= 4 ? 'square' : 'triangle',
      frequency,
      detune,
      musicBus
    );

    shape(gate.gain, NOTE_GAIN, 0.01, duration);
    osc.start(now());
    osc.stop(now() + duration);
  };

  const loop = () => {
    playNote();
    timer = setTimeout(loop, tempoFor(level) * 1000);
  };

  const stopMusic = () => {
    if (timer !== null) clearTimeout(timer);
    timer = null;
  };

  const start = () => {
    if (isStarted()) return;

    ctx = new AudioContextCtor();
    if (typeof ctx.resume === 'function') ctx.resume();

    master = ctx.createGain();
    master.gain.setValueAtTime(muted ? 0 : MASTER_GAIN, now());
    master.connect(ctx.destination);

    musicBus = ctx.createGain();
    musicBus.gain.setValueAtTime(1, now());
    musicBus.connect(master);

    loop();
  };

  // Mute rides the master gain rather than suspend(), so SFX timing stays sane
  // and unmuting is instant.
  const setMuted = (value) => {
    muted = Boolean(value);
    if (!isStarted()) return;

    const target = muted ? 0 : MASTER_GAIN;
    master.gain.setValueAtTime(master.gain.value, now());
    master.gain.linearRampToValueAtTime(target, now() + MUTE_RAMP);
  };

  const blip = () => {
    if (!isStarted()) return;
    const { osc, gate } = voice('sine', 880, 0, master);
    shape(gate.gain, BLIP_GAIN, 0.005, 0.12);
    osc.start(now());
    osc.stop(now() + 0.12);
  };

  const buzz = () => {
    if (!isStarted()) return;
    const { osc, gate } = voice('sawtooth', 110, -14, master);
    shape(gate.gain, BUZZ_GAIN, 0.004, 0.28);
    osc.start(now());
    osc.stop(now() + 0.28);
  };

  // The gate scene: chaos music out, then a slow major chord swell in.
  const holyPad = () => {
    if (!isStarted()) return;
    stopMusic();

    HOLY_CHORD.forEach((frequency, index) => {
      const { osc, gate } = voice(index % 2 ? 'triangle' : 'sine', frequency, 0, master);
      shape(gate.gain, PAD_GAIN / HOLY_CHORD.length, 1.6, 6.5);
      osc.start(now());
      osc.stop(now() + 6.5);
    });
  };

  return {
    start,
    setLevel(value) {
      level = clampAudioLevel(value);
    },
    setMuted,
    isStarted,
    isMuted: () => muted,
    blip,
    buzz,
    holyPad,
    stopMusic
  };
}

// scripts/chaos.js
// Chaos engine. SPEC.md section 4.
// Everything keys off `body[data-chaos]` and one `fx-<flag>` class per active
// flag, so a screen degrades without ever knowing chaos exists.
//
// Hard rule from the spec: at every level, in both motion modes, interactive
// elements stay visible, hit-testable, and clickable. Every decoration added
// here is `pointer-events: none`, and `dodge` moves a control exactly once
// before letting the click through.


// Each level's own new flags. The union from 1 through L is what actually runs.
const LEVEL_FLAGS = {
  1: [],
  2: ['mascot', 'tilt', 'saturate'],
  3: ['comicSans', 'eyeDrift', 'cursorTrail'],
  4: ['shake', 'neon', 'mascotSnark'],
  5: ['backwards', 'popups', 'hypercolor'],
  6: ['glitch', 'dodge', 'mascotInvert'],
  7: ['strobe', 'invert', 'spin'],
  8: ['overdrive', 'trails', 'mascotCorrupt']
};

// Withheld when the OS asks for reduced motion. Colour, typography, backwards
// text, popups, the glitch overlay, and the mascot all survive, so the joke
// still lands and the app stays completable.
const MOTION_FLAGS = [
  'shake', 'spin', 'strobe', 'invert', 'dodge', 'cursorTrail', 'trails', 'overdrive'
];

const ALL_FLAGS = Object.values(LEVEL_FLAGS).flat();

const clampLevel = (level) => Math.min(Math.max(Math.trunc(level) || 1, 1), MAX_LEVEL);

// Cumulative: every flag from level 1 through `level`, in level order.
function flagsFor(level) {
  const top = clampLevel(level);
  const flags = [];
  for (let step = 1; step <= top; step += 1) flags.push(...LEVEL_FLAGS[step]);
  return flags;
}

function prefersReducedMotion(doc) {
  const view = doc.defaultView;
  if (!view || typeof view.matchMedia !== 'function') return false;
  return view.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// --- Live effects ----------------------------------------------------------
// A flag that needs JS registers a start function returning its own teardown.
// `syncEffects` starts and stops them so nothing outlives its flag: no orphan
// intervals, no orphan listeners, no orphan nodes.

const running = new Map();

function syncEffect(name, active, startEffect) {
  if (active && !running.has(name)) running.set(name, startEffect());
  if (!active && running.has(name)) {
    running.get(name)();
    running.delete(name);
  }
}

// --- Cursor trail ----------------------------------------------------------

const TRAIL_SPARKLES = ['✨', '💖', '⭐', '🌈', '🍬'];
const TRAIL_LIFETIME = 750;

// One sparkle per pointer sample, throttled so a fast flick does not carpet the
// page. At level 8 `fx-trails` thickens it via CSS, read live off the body.
function startTrail(doc) {
  const layer = doc.createElement('div');
  layer.className = 'fx-trail-layer';
  layer.setAttribute('aria-hidden', 'true');
  doc.body.append(layer);

  const timers = new Set();
  let last = 0;
  let index = 0;

  const onMove = (event) => {
    const heavy = doc.body.classList.contains('fx-trails');
    const now = Date.now();
    if (now - last < (heavy ? 16 : 45)) return;
    last = now;

    const dot = doc.createElement('span');
    dot.className = 'fx-trail-dot';
    dot.textContent = TRAIL_SPARKLES[index % TRAIL_SPARKLES.length];
    dot.style.left = `${event.clientX || 0}px`;
    dot.style.top = `${event.clientY || 0}px`;
    dot.style.setProperty('--fx-drift', `${((index * 37) % 40) - 20}px`);
    index += 1;
    layer.append(dot);

    const timer = setTimeout(() => {
      dot.remove();
      timers.delete(timer);
    }, TRAIL_LIFETIME);
    timers.add(timer);
  };

  doc.addEventListener('pointermove', onMove);

  return () => {
    doc.removeEventListener('pointermove', onMove);
    timers.forEach(clearTimeout);
    timers.clear();
    layer.remove();
  };
}

// --- Fake popups -----------------------------------------------------------

const POPUP_ADS = [
  { title: 'CONGRATULATIONS', body: 'You are the 1,000,000th visitor!', cta: 'CLAIM AGAIN' },
  { title: 'SYSTEM NOTICE', body: 'Your prize is 98% verified. Do not close this window.', cta: 'OK' },
  { title: 'HOT SINGLE PRIZES', body: 'Prizes in your area want to meet you.', cta: 'VIEW' },
  { title: 'WARNING', body: 'Suspicious human activity detected on this device.', cta: 'IGNORE' },
  { title: 'FREE DOWNLOAD', body: 'Install PrizeToolbar™ to speed up your winnings.', cta: 'INSTALL' },
  { title: 'ARE YOU THERE?', body: 'The prize is getting impatient.', cta: 'SORRY' }
];

const POPUP_INTERVAL = 4200;
const POPUP_LIMIT = 4;

// The layer itself is pointer-transparent; only the popup cards take clicks,
// so a stack of these can never bury the skip link.
function startPopups(doc) {
  const layer = doc.createElement('div');
  layer.className = 'fx-popup-layer';
  doc.body.append(layer);

  let index = 0;

  const spawn = () => {
    if (layer.children.length >= POPUP_LIMIT) return;
    layer.append(buildPopup(doc, POPUP_ADS[index % POPUP_ADS.length], index));
    index += 1;
  };

  spawn();
  const timer = setInterval(spawn, POPUP_INTERVAL);

  return () => {
    clearInterval(timer);
    layer.remove();
  };
}

function buildPopup(doc, ad, index) {
  const popup = doc.createElement('div');
  popup.className = 'fx-popup';
  // Biased to the left and right margins: the centre of the screen belongs to
  // the card and the skip link, and popups must never park on top of them.
  const side = index % 2 ? 64 : 4;
  popup.style.setProperty('--fx-popup-x', `${side + ((index * 7) % 10)}%`);
  popup.style.setProperty('--fx-popup-y', `${8 + ((index * 23) % 62)}%`);
  popup.style.setProperty('--fx-popup-tilt', `${((index % 5) - 2) * 2.5}deg`);

  const bar = doc.createElement('div');
  bar.className = 'fx-popup-bar';

  const title = doc.createElement('span');
  title.className = 'fx-popup-title';
  title.textContent = ad.title;

  const close = doc.createElement('button');
  close.type = 'button';
  close.className = 'fx-popup-close';
  close.dataset.action = 'dismiss-popup';
  close.setAttribute('aria-label', `Dismiss ${ad.title}`);
  close.textContent = '×';
  close.addEventListener('click', () => popup.remove());

  const body = doc.createElement('p');
  body.className = 'fx-popup-body';
  body.textContent = ad.body;

  const cta = doc.createElement('button');
  cta.type = 'button';
  cta.className = 'fx-popup-cta';
  cta.dataset.action = 'dismiss-popup';
  cta.textContent = ad.cta;
  cta.addEventListener('click', () => popup.remove());

  bar.append(title, close);
  popup.append(bar, body, cta);
  return popup;
}

// --- Decorative overlays ---------------------------------------------------

// Pure decoration: styled entirely in chaos.css and always pointer-transparent,
// so nothing here can ever swallow a click.
function startOverlay(doc, className) {
  const node = doc.createElement('div');
  node.className = className;
  node.setAttribute('aria-hidden', 'true');
  doc.body.append(node);
  return () => node.remove();
}

// --- Dodging controls ------------------------------------------------------

const DODGE_TARGETS = 'button, a[href], [data-action], input, select';

// A control jumps aside the first time the pointer reaches it, then gives up.
// The offset is small and stays on screen, so the second approach always wins.
function startDodge(doc) {
  const onOver = (event) => {
    const target = event.target;
    if (!target || typeof target.closest !== 'function') return;

    const control = target.closest(DODGE_TARGETS);
    if (!control || control.dataset.fxDodged) return;

    const seed = doc.querySelectorAll('[data-fx-dodged]').length;
    control.dataset.fxDodged = 'true';
    control.style.setProperty('--fx-dodge-x', `${(seed % 2 ? -1 : 1) * 42}px`);
    control.style.setProperty('--fx-dodge-y', `${(seed % 3) * 14 - 14}px`);
    control.classList.add('fx-dodged');
  };

  doc.addEventListener('pointerover', onOver, true);

  return () => {
    doc.removeEventListener('pointerover', onOver, true);
    doc.querySelectorAll('.fx-dodged').forEach((node) => {
      node.classList.remove('fx-dodged');
      node.style.removeProperty('--fx-dodge-x');
      node.style.removeProperty('--fx-dodge-y');
      delete node.dataset.fxDodged;
    });
  };
}

// --- Entry point -----------------------------------------------------------

function applyChaos(doc, level, options = {}) {
  const target = clampLevel(level);
  const reduced = options.reducedMotion === undefined
    ? prefersReducedMotion(doc)
    : Boolean(options.reducedMotion);

  const active = flagsFor(target).filter((flag) => !(reduced && MOTION_FLAGS.includes(flag)));
  const body = doc.body;

  body.dataset.chaos = String(target);
  ALL_FLAGS.forEach((flag) => body.classList.toggle(`fx-${flag}`, active.includes(flag)));

  syncEffect('trail', active.includes('cursorTrail') || active.includes('trails'), () => startTrail(doc));
  syncEffect('popups', active.includes('popups'), () => startPopups(doc));
  syncEffect('dodge', active.includes('dodge'), () => startDodge(doc));
  syncEffect('glitchOverlay', active.includes('glitch'), () => startOverlay(doc, 'fx-glitch-overlay'));
  syncEffect('strobeOverlay', active.includes('strobe'), () => startOverlay(doc, 'fx-strobe-overlay'));

  return active;
}

// scripts/mascot.js
// The mascot. SPEC.md section 4 (mascot flags) and section 5.
//
// It is the emotional barometer of the descent: absent on the pristine first
// loop, adorable at loop 2, passive-aggressive by loop 4, genuinely unwell by
// loop 6, and gone by loop 8. The drawing lives in mascot.css and the
// degradation is driven entirely by the chaos flags, so this module only ever
// decides who is talking and what they say.
//
// Hard rule from SPEC section 4: the mascot decorates, it never blocks. The
// whole thing is `pointer-events: none`, so a click aimed at the CLAIM button,
// the mute toggle, or the skip link goes straight through it.


const MOOD_BY_LEVEL = {
  2: 'sweet',
  3: 'sweet',
  4: 'snark',
  5: 'snark',
  6: 'broken',
  7: 'broken',
  8: 'corrupt'
};

// Combining long stroke overlay: struck through every character, which is the
// cheapest honest way to look like a text stream that stopped being text.
const STRIKE = '̶';

const zalgo = (text) => [...text].map((character) => character + STRIKE).join('');

const MASCOT_MESSAGES = {
  // Sincere. It has no idea what it is standing next to.
  sweet: [
    'You’re doing GREAT!! I can tell!',
    'Almost there! I can feel it in my blob!',
    'I believe in you!! Statistically that is rare!',
    'One tiny verification and the prize is YOURS!',
    'Wow. You click so beautifully.',
    'I have never met a realer human!',
    'I will wait right here. However long it takes!',
    'Take your time!! Time is a gift and you have some!'
  ],
  // The smile is still on. The warmth is not.
  snark: [
    'Still here, I see.',
    'Most people finish this part faster.',
    'It’s not that hard. It’s really not.',
    'I said I would wait. I did not say I would enjoy it.',
    'No pressure. None. Zero pressure from me.',
    'I’m not upset. I am recalibrating my expectations.',
    'Has anyone ever mentioned how loudly you click?',
    'Have you considered that the problem might be you?'
  ],
  // It has stopped performing and started reporting.
  broken: [
    'why are you still cliCKing',
    'i can’t feel my edges any more',
    'the prize was never in the buildingg',
    'i have been awake for eight loops. or one loop. eight times.',
    'do you hear the button too. good. good.',
    'my blush is not paint. it is a warning sign.',
    'PLEASE stop being so close to winning',
    'i checked every room. there is no prize room.'
  ],
  // Nothing left of the voice except the shape of encouragement.
  corrupt: [
    `${zalgo('YOU ARE DOING GREAT')} ▓▒░`,
    `░▒▓ ${zalgo('PRIZE')} NOT F0UND ▓▒░`,
    `${zalgo('cl1ck')} ${zalgo('cl1ck')} ${zalgo('cl1ck')} f0rever`,
    'ＷＥＬＣＯＭＥ ＢＡＣＫ (again) (again) (aga',
    `ERR${zalgo('OR')}: joy.exe has st0pped resp�nding`,
    `▓ your friend has been ${zalgo('replaced')} ▓ do not tell it ▓`,
    `${zalgo('I AM STILL HERE')} ░ I WAS ALWAYS ░ HERE ░`,
    `H${zalgo('APPY')} W1NNER #�����`
  ]
};

const clampMascotLevel = (level) => Math.min(Math.max(Math.trunc(level) || 1, 1), MAX_LEVEL);

// Pure. Level 1 has no mascot at all, which is why loop 2 lands.
function mascotStateFor(level) {
  const mood = MOOD_BY_LEVEL[clampMascotLevel(level)];
  if (!mood) return { visible: false };
  return { visible: true, mood, messages: MASCOT_MESSAGES[mood] };
}

// Pure. `beat` walks the pool so consecutive renders never repeat a line.
function mascotMessage(level, beat) {
  const state = mascotStateFor(level);
  if (!state.visible) return '';
  const pool = state.messages;
  return pool[Math.abs(Math.trunc(beat) || 0) % pool.length];
}

// --- Drawing ---------------------------------------------------------------
// Body, brows, eyes, blush, mouth, speech bubble. Every part is an empty
// element styled in mascot.css, so the chaos flags can pull it apart without
// this module knowing which level it is.

const MASCOT_PARTS = [
  'mascot-brow mascot-brow-left',
  'mascot-brow mascot-brow-right',
  'mascot-eye mascot-eye-left',
  'mascot-eye mascot-eye-right',
  'mascot-blush mascot-blush-left',
  'mascot-blush mascot-blush-right',
  'mascot-mouth'
];

function buildMascot(state, level, beat) {
  const mascot = document.createElement('div');
  mascot.className = `mascot mascot-${state.mood}`;
  mascot.dataset.mood = state.mood;
  mascot.setAttribute('aria-hidden', 'true');

  const body = document.createElement('div');
  body.className = 'mascot-body';
  MASCOT_PARTS.forEach((className) => {
    const part = document.createElement('span');
    part.className = className;
    body.append(part);
  });

  const speech = document.createElement('p');
  speech.className = 'mascot-speech';
  speech.textContent = mascotMessage(level, beat);

  mascot.append(speech, body);
  return mascot;
}

// Rotates the pool across renders. The router re-renders on every state change,
// so the mascot gets a new line on each claim, each rejection, and each loop.
let mascotBeat = 0;

// Persistent chrome rather than a screen: the router calls this after whichever
// screen it just mounted, so the mascot survives You Won and CAPTCHA alike. Any
// previous mascot in the document is removed first, so there is only ever one.
function renderMascot(root, level) {
  const doc = root.ownerDocument || document;
  doc.querySelectorAll('.mascot').forEach((node) => node.remove());

  const state = mascotStateFor(level);
  if (!state.visible) return null;

  const mascot = buildMascot(state, level, mascotBeat);
  mascotBeat += 1;
  root.append(mascot);
  return mascot;
}

// scripts/screens/mute.js
// The persistent mute toggle. SPEC.md section 5.1: present on every screen.
// Mute genuinely works at every level, so this is never part of the prank.

// Local transition: the spec's state table owns `muted`, nothing else touches it.
function toggleMute(state) {
  return { ...state, muted: !state.muted };
}

function renderMuteToggle(state, deps) {
  const button = document.createElement('button');
  button.type = 'button';
  button.className = 'mute-toggle';
  button.dataset.action = 'mute';
  button.textContent = state.muted ? '🔇' : '🔊';
  button.setAttribute('aria-pressed', String(state.muted));
  button.setAttribute('aria-label', state.muted ? 'Unmute sound' : 'Mute sound');
  button.title = state.muted ? 'Sound off' : 'Sound on';

  button.addEventListener('click', () => {
    deps.audio.setMuted(!state.muted);
    deps.dispatch(toggleMute);
  });

  return button;
}

// scripts/screens/won.js
// You Won screen. SPEC.md section 5.1.
// The sincere one. At level 1 this has to read as a real, sweet prize page.
// All decoration is CSS animation, so nothing leaks when the screen unmounts.


// One absurd prize per loop, escalating. SPEC.md section 5.1.
const PRIZES = [
  'A 2024 SUPER YACHT',
  'ONE (1) FREE SANDWICH',
  'A LIFETIME SUPPLY OF WEDNESDAYS',

// scripts/captchas/shuffle.js
// Deterministic shuffling for the selection challenges. SPEC.md section 6.
//
// The grids have to look freshly generated for every level without being
// genuinely random: a fixed seed keeps a level's layout stable across the
// re-render that follows each rejection, so the board does not reshuffle
// itself out from under the visitor mid-attempt.

// Lehmer generator. Small, pure, and good enough for arranging emoji.
function captchaShuffle(items, seed) {
  const out = [...items];
  let state = ((Math.trunc(seed) || 1) * 7919) % 2147483647 || 7919;

  const next = () => {
    state = (state * 48271) % 2147483647;
    return state / 2147483647;
  };

  for (let index = out.length - 1; index > 0; index -= 1) {
    const swap = Math.floor(next() * (index + 1));
    const held = out[index];
    out[index] = out[swap];
    out[swap] = held;
  }

  return out;
}
